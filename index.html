<style>
  :root{
    color-scheme: light;
    --plane:#f4f4f2; --surface:#ffffff; --surface-2:#faf9f6;
    --ink:#0e0e0e; --ink-2:#4c4a45; --muted:#8a877f;
    --grid:#e5e3dd; --baseline:#c9c6bd; --border:rgba(14,14,14,0.10);
    --amber:#ffc000; --amber-deep:#8a6500; --brand-ink:#8a6500; --black:#0e0e0e;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --shadow:0 1px 2px rgba(14,14,14,.05),0 6px 20px rgba(14,14,14,.06);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0a0a0a; --surface:#161615; --surface-2:#1d1d1b;
    --ink:#f7f6f3; --ink-2:#bdbab2; --muted:#8a877f;
    --grid:#2a2a27; --baseline:#3a3a36; --border:rgba(255,255,255,0.11);
    --amber:#ffc000; --amber-deep:#ffc000; --brand-ink:#ffc000; --black:#0e0e0e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#0ca30c; --good-ink:#3fc55f; --warn:#fab219; --serious:#ec835a; --critical:#e2635f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--plane); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  .masthead{
    background:var(--black); border-radius:16px; padding:18px 22px; margin-bottom:22px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.07);
    position:relative; overflow:hidden;
  }
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}
  .masthead img.logo{height:56px;width:auto;display:block;flex-shrink:0}
  .masthead .mh-mid{flex:1;min-width:180px}
  .masthead .mh-inst{font-size:12.5px;color:#b9b6ae;letter-spacing:.01em}
  .masthead .mh-role{font-size:13px;color:#fff;font-weight:600;margin-top:3px}
  .masthead .mh-by{
    font-size:12px;color:var(--amber);font-weight:700;letter-spacing:.02em;
    border:1px solid rgba(255,192,0,.42);border-radius:999px;padding:7px 14px;white-space:nowrap;
  }
  .masthead .mh-by small{display:block;font-size:10px;color:#8f8c85;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
  h1 .brk{color:var(--amber);font-weight:800}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:5px}
  .ctrls{display:flex;gap:8px;align-items:center}
  .theme-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;font-weight:600;
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--amber)}
  .lang-seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang-seg button{
    border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:8px 14px;cursor:pointer;transition:.12s;
  }
  .lang-seg button.active{background:var(--amber);color:#0e0e0e}
  .lang-seg button:not(.active):hover{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 4px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .kpi .accent{height:3px;border-radius:2px;margin-bottom:12px;width:32px;background:var(--amber)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2)}
  .kpi .note{font-size:12px;color:var(--ink-2);margin-top:6px}
  .kpi .note.up{color:var(--good-ink);font-weight:600}

  .tabs{display:flex;gap:4px;margin:26px 0 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{
    border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--muted);padding:10px 15px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s;
  }
  .tab:hover{color:var(--ink-2)}
  .tab.active{color:var(--ink);border-bottom-color:var(--amber)}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
  .chart-card h3::before{content:"[ ";color:var(--amber);font-weight:800}
  .chart-card h3::after{content:" ]";color:var(--amber);font-weight:800}
  .chart-card .cap{font-size:12px;color:var(--muted);margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar-row .name{width:132px;font-size:12.5px;color:var(--ink-2);flex-shrink:0;text-align:right;font-weight:600;line-height:1.25}
  .bar-track{flex:1;background:var(--grid);border-radius:5px;height:22px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .bar-row .num{width:72px;font-size:12.5px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;align-items:center}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;
  }
  .chip:hover{border-color:var(--amber);color:var(--ink)}
  .chip.active{background:var(--amber);color:#0e0e0e;border-color:var(--amber)}
  .search{
    margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 15px;font-size:13px;font-family:inherit;min-width:210px;
  }
  .search:focus{outline:2px solid var(--amber);outline-offset:1px}
  .search::placeholder{color:var(--muted)}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s;
    border-left:3px solid transparent;
  }
  .card:hover{border-color:var(--baseline);border-left-color:var(--amber);transform:translateY(-2px)}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .card h4{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:7px}
  .card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .card .meta b{color:var(--ink-2);font-weight:600}
  .card p{font-size:13px;color:var(--ink-2);line-height:1.55;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
  .card .date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card a.link{font-size:12px;font-weight:700;color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .card a.link:hover{text-decoration:underline}
  .verified{font-size:10.5px;color:var(--good-ink);font-weight:600}
  .unverified{font-size:10.5px;color:var(--serious);font-weight:600}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:13px}

  .callout{
    background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--amber);
    border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--ink-2);margin:20px 0 4px;line-height:1.6;
  }
  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.7}
  footer .sig{
    display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink);
    border-top:2px solid var(--amber);padding-top:7px;
  }
  footer .sig span{color:var(--amber)}
  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid-2,.cards{grid-template-columns:1fr}
    .search{margin-left:0;width:100%}
    .masthead img.logo{height:42px}
  }

  /* ===== annual archive: compact rows, meant to be scanned ===== */
  .arch-month{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;
    padding-bottom:6px;border-bottom:1px solid var(--border)}
  .arch-month h3{font-size:15px;font-weight:700}
  .arch-month .n{font-size:12px;color:var(--muted);font-weight:600}
  .arch-row{display:grid;grid-template-columns:52px 150px 1fr;gap:12px;align-items:start;
    padding:10px 8px;border-radius:8px;transition:.12s;border-left:2px solid transparent}
  .arch-row:hover{background:var(--surface);border-left-color:var(--amber)}
  .arch-row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
  .arch-row .j{font-size:11px;font-weight:700;padding-top:2px;line-height:1.3}
  .arch-row .t{font-size:13.5px;line-height:1.45}
  .arch-row .t a{color:var(--ink);text-decoration:none;font-weight:600}
  .arch-row .t a:hover{color:var(--brand-ink);text-decoration:underline}
  .arch-row .t .sum{display:block;color:var(--ink-2);font-size:12.5px;font-weight:400;margin-top:3px}
  .arch-row .t .who{color:var(--muted);font-size:11.5px;font-weight:400}
  .arch-star{color:var(--amber);font-weight:800;margin-right:4px}
  @media(max-width:820px){.arch-row{grid-template-columns:46px 1fr;gap:8px}
    .arch-row .j{grid-column:2;order:3;color:var(--muted)}}
</style>
</head>

   desc_en:"Polyanion coordination chemistry boosts fluoride electrolyte conductivity for 5 V-class solid-state cells."},
  {doi:"10.1016/j.joule.2025.102219",
   title:"Non-solvating additives for high-voltage sodium metal batteries",
   journal:"Joule", date:"2026-01", cat:"소재",
   org:"Guo 외", org_en:"Guo et al.", nv:false,
   link:"https://doi.org/10.1016/j.joule.2025.102219",
   desc:"비용매화 첨가제로 고전압 나트륨 금속 전지를 안정화.",
   desc_en:"Non-solvating additives stabilize high-voltage sodium metal batteries."},
  {doi:"10.1016/j.joule.2025.102232",
   title:"Dendrite suppression in garnet electrolytes via thermally induced compressive stress",
   journal:"Joule", date:"2026-01", cat:"소재",
   org:"Yu 외", org_en:"Yu et al.", nv:false,
   link:"https://doi.org/10.1016/j.joule.2025.102232",
   desc:"열유도 압축응력으로 가넷 전해질 내 덴드라이트를 억제.",
   desc_en:"Thermally induced compressive stress suppresses dendrites in garnet electrolytes."},
  {doi:"10.1016/j.joule.2025.102226",
   title:"A strategic tuning of interfacial Li+ solvation with ultrathin polymer layers for anode-free lithium metal batteries",
   journal:"Joule", date:"2026-01", cat:"소재",
   org:"Lee 외", org_en:"Lee et al.", nv:false,
   link:"https://doi.org/10.1016/j.joule.2025.102226",
   desc:"초박막 고분자층으로 계면 리튬 용매화를 조절해 무음극 리튬 금속 전지를 구현.",
   desc_en:"Ultrathin polymer layers tune interfacial Li solvation for anode-free lithium metal batteries."},
];

/* ================= STATE & HELPERS ================= */
let lang="en", rCat="전체", iReg="전체", rQ="", iQ="", aJ="전체";
const T=()=>I18N[lang];
const CATCLR={"소재":"var(--s1)","전극":"var(--s2)","셀":"var(--s3)","공정":"var(--s4)","저널":"var(--s5)"};
const REGCLR={"국내":"var(--s1)","해외":"var(--s2)"};
const badge=(t,c,bg)=>`<span class="badge" style="color:${c};background:${bg}">${t}</span>`;
const tint=v=>`color-mix(in srgb, ${v} 14%, transparent)`;
const verBadge=v=>v?`<span class="verified">${T().ver}</span>`:`<span class="unverified">${T().unver}</span>`;
const catLbl=c=>CATLBL[c][lang], regLbl=r=>REGLBL[r][lang];
const subLbl=s=>lang==="en"?(SUBLBL[s]||s):s;
const typeLbl=t=>TYPELBL[t]?TYPELBL[t][lang]:t;
const compLbl=c=>lang==="en"?(COMPANY_EN[c]||c):c;

/* ================= RENDER ================= */
function applyStatic(){
  const t=T();
  document.documentElement.lang=lang;
  const set=(id,v)=>{document.getElementById(id).innerHTML=v;};
  set('mhRole',t.mhRole); set('eyebrow',t.eyebrow); set('h1txt',t.h1); set('subLine',t.sub);
  set('k1l',t.k1l); set('k1v',t.k1v); set('k1n',t.k1n);
  set('k2l',t.k2l); set('k2n',t.k2n); set('k3l',t.k3l); set('k3n',t.k3n); set('k4l',t.k4l);
  set('tabR',t.tabR); set('tabI',t.tabI); set('tabC',t.tabC); set('tabA',t.tabA);
  set('cc1t',t.cc1t); set('cc1c',t.cc1c); set('cc2t',t.cc2t); set('cc2c',t.cc2c);
  set('cc3t',t.cc3t); set('cc3c',t.cc3c); set('cc4t',t.cc4t); set('cc4c',t.cc4c);
  set('calloutR',t.calloutR); set('calloutI',t.calloutI); set('calloutA',t.calloutA);
  set('footSrc',t.footSrc); set('footNote',t.footNote);
  document.getElementById('totalCount').textContent=research.length+industry.length;
  document.getElementById('totalNote').textContent=t.k4n(research.length,industry.length);
  updateThemeBtn();
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
function updateThemeBtn(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').textContent=dark?T().toLight:T().toDark;
}
function renderResearch(){
  const box=document.getElementById('researchCards'); const q=rQ.toLowerCase();
  const items=research.filter(r=>(rCat==="전체"||r.cat===rCat)&&(!q||(r.title+r.desc+(r.desc_en||"")+(r.org||"")+r.journal+r.sub).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(r=>{
    const c=CATCLR[r.cat];
    const title=lang==="en"&&r.title_en?r.title_en:r.title;
    const org=lang==="en"&&r.org_en?r.org_en:r.org;
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card">
      <div class="badges">${badge(catLbl(r.cat),c,tint(c))}${badge(subLbl(r.sub),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${title}</h4>
      <div class="meta"><b>${r.journal}</b> · ${org}</div>
      <p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkR}</a></div></div>`;
  }).join('');
}
function renderIndustry(){
  const box=document.getElementById('industryCards'); const q=iQ.toLowerCase();
  const items=industry.filter(r=>(iReg==="전체"||r.region===iReg)&&(!q||(r.company+(COMPANY_EN[r.company]||"")+r.desc+(r.desc_en||"")+r.type).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(r=>{
    const c=REGCLR[r.region];
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card">
      <div class="badges">${badge(regLbl(r.region),c,tint(c))}${badge(typeLbl(r.type),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${compLbl(r.company)}</h4><p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkI}</a></div></div>`;
  }).join('');
}
function renderArchive(){
  const box=document.getElementById('archiveList');
  const items=archive.filter(x=>aJ==="전체"||x.journal===aJ);
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  const byMonth={};
  items.forEach(x=>{const m=x.date.slice(0,7);(byMonth[m]=byMonth[m]||[]).push(x);});
  box.innerHTML=Object.keys(byMonth).sort().reverse().map(m=>{
    const rows=byMonth[m].slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(x=>{
      const c=CATCLR[x.cat]||'var(--ink-2)';
      const org=lang==="en"&&x.org_en?x.org_en:x.org;
      const desc=lang==="en"?x.desc_en:x.desc;
      /* Joule deposits month-only dates to Crossref; the month header already carries that,
         so show a dash rather than a two-digit month masquerading as a day. */
      const day=x.date.length>7?x.date.slice(5):"—";
      return `<div class="arch-row">
        <div class="d">${day}</div>
        <div class="j" style="color:${c}">${x.journal}</div>
        <div class="t">
          ${x.nv?'<span class="arch-star" title="News &amp; Views">★</span>':''}
          <a href="${x.link}" target="_blank" rel="noopener">${x.title}</a>
          <span class="who"> · ${org}</span>
          <span class="sum">${desc}</span>
        </div></div>`;
    }).join('');
    return `<div class="arch-month"><h3>${m}</h3><span class="n">${byMonth[m].length}</span></div>${rows}`;
  }).join('');
}
function renderFilters(){
  const rCats=["전체","소재","전극","셀","공정","저널"];
  document.getElementById('researchFilters').innerHTML=
    rCats.map(c=>`<button class="chip${c===rCat?' active':''}" data-rc="${c}">${catLbl(c)} <span style="opacity:.7">${c==="전체"?research.length:research.filter(x=>x.cat===c).length}</span></button>`).join('')
    +`<input class="search" id="rSearch" placeholder="${T().searchR}" value="${rQ.replace(/"/g,'&quot;')}">`;
  const iRegs=["전체","국내","해외"];
  document.getElementById('industryFilters').innerHTML=
    iRegs.map(c=>`<button class="chip${c===iReg?' active':''}" data-ir="${c}">${regLbl(c)} <span style="opacity:.7">${c==="전체"?industry.length:industry.filter(x=>x.region===c).length}</span></button>`).join('')
    +`<input class="search" id="iSearch" placeholder="${T().searchI}" value="${iQ.replace(/"/g,'&quot;')}">`;
  document.getElementById('rSearch').addEventListener('input',e=>{rQ=e.target.value;renderResearch();});
  document.getElementById('iSearch').addEventListener('input',e=>{iQ=e.target.value;renderIndustry();});
  const aCount={};archive.forEach(x=>{aCount[x.journal]=(aCount[x.journal]||0)+1;});
  const aJournals=["전체"].concat(Object.keys(aCount).sort((a,b)=>aCount[b]-aCount[a]||a.localeCompare(b)));
  document.getElementById('archiveFilters').innerHTML=
    aJournals.map(j=>`<button class="chip${j===aJ?' active':''}" data-aj="${j}">${j==="전체"?catLbl("전체"):j} <span style="opacity:.7">${j==="전체"?archive.length:aCount[j]}</span></button>`).join('');
}
function hbar(container,rows,unit){
  const max=Math.max(...rows.map(r=>Math.abs(r.v)));
  document.getElementById(container).innerHTML=rows.map(r=>{
    const w=Math.max(2,Math.abs(r.v)/max*100);
    return `<div class="bar-row"><div class="name">${r.n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${r.c||'var(--s1)'}"></div></div>
      <div class="num">${r.v.toLocaleString()}${unit||''}</div></div>`;}).join('');
}
function renderCharts(){
  const t=T();
  hbar('chartCat',["소재","전극","셀","공정","저널"].map(c=>({n:catLbl(c),v:research.filter(x=>x.cat===c).length,c:CATCLR[c]})),t.unitCount);
  hbar('chartEarnings',[
    {n:compLbl("SK온"),v:8218},{n:compLbl("삼성SDI"),v:2038},{n:compLbl("LG에너지솔루션"),v:1133},
    {n:compLbl("포스코퓨처엠"),v:267},{n:compLbl("에코프로비엠"),v:180}].map(r=>({...r,c:"var(--s1)"})),t.unitEok);
  const nt={};industry.forEach(i=>{nt[i.type]=(nt[i.type]||0)+1;});
  hbar('chartNews',Object.entries(nt).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n:typeLbl(n),v,c:"var(--s3)"})),t.unitCount);
  document.getElementById('themeList').innerHTML=t.themes
    .map(([k,v])=>`<div><span style="color:var(--amber);font-weight:800">▸</span> <b style="color:var(--ink)">${k}</b> — ${v}</div>`).join('');
}
function renderAll(){applyStatic();renderFilters();renderResearch();renderIndustry();renderArchive();renderCharts();}

/* ================= EVENTS ================= */
document.getElementById('researchFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-rc]');if(!b)return;
  rCat=b.dataset.rc;
  document.querySelectorAll('[data-rc]').forEach(x=>x.classList.toggle('active',x.dataset.rc===rCat));
  renderResearch();
});
document.getElementById('industryFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-ir]');if(!b)return;
  iReg=b.dataset.ir;
  document.querySelectorAll('[data-ir]').forEach(x=>x.classList.toggle('active',x.dataset.ir===iReg));
  renderIndustry();
});
document.getElementById('archiveFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-aj]');if(!b)return;
  aJ=b.dataset.aj;
  document.querySelectorAll('[data-aj]').forEach(x=>x.classList.toggle('active',x.dataset.aj===aJ));
  renderArchive();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');}));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  updateThemeBtn();
});
document.getElementById('langSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;renderAll();
});

/* ================= INIT (dark + Korean by default) ================= */
renderAll();
</script>
</body>
</html>
