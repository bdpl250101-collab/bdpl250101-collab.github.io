<style>
  :root{
    color-scheme: light;
    --plane:#f4f4f2; --surface:#ffffff; --surface-2:#faf9f6;
    --ink:#0e0e0e; --ink-2:#4c4a45; --muted:#8a877f;
    --grid:#e5e3dd; --baseline:#c9c6bd; --border:rgba(14,14,14,0.10);
    --amber:#ffc000; --amber-deep:#8a6500; --brand-ink:#8a6500; --black:#0e0e0e;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --shadow:0 1px 2px rgba(14,14,14,.05),0 6px 20px rgba(14,14,14,.06);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0a0a0a; --surface:#161615; --surface-2:#1d1d1b;
    --ink:#f7f6f3; --ink-2:#bdbab2; --muted:#8a877f;
    --grid:#2a2a27; --baseline:#3a3a36; --border:rgba(255,255,255,0.11);
    --amber:#ffc000; --amber-deep:#ffc000; --brand-ink:#ffc000; --black:#0e0e0e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#0ca30c; --good-ink:#3fc55f; --warn:#fab219; --serious:#ec835a; --critical:#e2635f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--plane); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  .masthead{
    background:var(--black); border-radius:16px; padding:18px 22px; margin-bottom:22px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.07);
    position:relative; overflow:hidden;
  }
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}
  .masthead img.logo{height:56px;width:auto;display:block;flex-shrink:0}
  .masthead .mh-mid{flex:1;min-width:180px}
  .masthead .mh-inst{font-size:12.5px;color:#b9b6ae;letter-spacing:.01em}
  .masthead .mh-role{font-size:13px;color:#fff;font-weight:600;margin-top:3px}
  .masthead .mh-by{
    font-size:12px;color:var(--amber);font-weight:700;letter-spacing:.02em;
    border:1px solid rgba(255,192,0,.42);border-radius:999px;padding:7px 14px;white-space:nowrap;
  }
  .masthead .mh-by small{display:block;font-size:10px;color:#8f8c85;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
  h1 .brk{color:var(--amber);font-weight:800}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:5px}
  .ctrls{display:flex;gap:8px;align-items:center}
  .theme-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;font-weight:600;
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--amber)}
  .lang-seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang-seg button{
    border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:8px 14px;cursor:pointer;transition:.12s;
  }
  .lang-seg button.active{background:var(--amber);color:#0e0e0e}
  .lang-seg button:not(.active):hover{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 4px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .kpi .accent{height:3px;border-radius:2px;margin-bottom:12px;width:32px;background:var(--amber)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2)}
  .kpi .note{font-size:12px;color:var(--ink-2);margin-top:6px}
  .kpi .note.up{color:var(--good-ink);font-weight:600}

  .tabs{display:flex;gap:4px;margin:26px 0 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{
    border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--muted);padding:10px 15px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s;
  }
  .tab:hover{color:var(--ink-2)}
  .tab.active{color:var(--ink);border-bottom-color:var(--amber)}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
  .chart-card h3::before{content:"[ ";color:var(--amber);font-weight:800}
  .chart-card h3::after{content:" ]";color:var(--amber);font-weight:800}
  .chart-card .cap{font-size:12px;color:var(--muted);margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar-row .name{width:132px;font-size:12.5px;color:var(--ink-2);flex-shrink:0;text-align:right;font-weight:600;line-height:1.25}
  .bar-track{flex:1;background:var(--grid);border-radius:5px;height:22px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .bar-row .num{width:72px;font-size:12.5px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;align-items:center}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;
  }
  .chip:hover{border-color:var(--amber);color:var(--ink)}
  .chip.active{background:var(--amber);color:#0e0e0e;border-color:var(--amber)}
  .search{
    margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 15px;font-size:13px;font-family:inherit;min-width:210px;
  }
  .search:focus{outline:2px solid var(--amber);outline-offset:1px}
  .search::placeholder{color:var(--muted)}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s;
    border-left:3px solid transparent;
  }
  .card:hover{border-color:var(--baseline);border-left-color:var(--amber);transform:translateY(-2px)}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .card h4{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:7px}
  .card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .card .meta b{color:var(--ink-2);font-weight:600}
  .card p{font-size:13px;color:var(--ink-2);line-height:1.55;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
  .card .date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card a.link{font-size:12px;font-weight:700;color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .card a.link:hover{text-decoration:underline}
  .card a.link.soft{color:var(--muted);font-weight:600}
  .card a.link.soft:hover{color:var(--ink-2)}
  .verified{font-size:10.5px;color:var(--good-ink);font-weight:600}
  .unverified{font-size:10.5px;color:var(--serious);font-weight:600}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:13px}

  .callout{
    background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--amber);
    border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--ink-2);margin:20px 0 4px;line-height:1.6;
  }
  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.7}
  footer .sig{
    display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink);
    border-top:2px solid var(--amber);padding-top:7px;
  }
  footer .sig span{color:var(--amber)}
  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid-2,.cards{grid-template-columns:1fr}
    .search{margin-left:0;width:100%}
    .masthead img.logo{height:42px}
  }

  /* ===== annual archive: compact rows, meant to be scanned ===== */
  .arch-month{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;
    padding-bottom:6px;border-bottom:1px solid var(--border)}
  .arch-month h3{font-size:15px;font-weight:700}
  .arch-month .n{font-size:12px;color:var(--muted);font-weight:600}
  .arch-row{display:grid;grid-template-columns:52px 150px 1fr;gap:12px;align-items:start;
    padding:10px 8px;border-radius:8px;transition:.12s;border-left:2px solid transparent}
  .arch-row:hover{background:var(--surface);border-left-color:var(--amber)}
  .arch-row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
  .arch-row .j{font-size:11px;font-weight:700;padding-top:2px;line-height:1.3}
  .arch-row .t{font-size:13.5px;line-height:1.45}
  .arch-row .t a{color:var(--ink);text-decoration:none;font-weight:600}
  .arch-row .t a:hover{color:var(--brand-ink);text-decoration:underline}
  .arch-row .t .sum{display:block;color:var(--ink-2);font-size:12.5px;font-weight:400;margin-top:3px}
  .arch-row .t .who{color:var(--muted);font-size:11.5px;font-weight:400}
  .arch-star{color:var(--amber);font-weight:800;margin-right:4px}
  @media(max-width:820px){.arch-row{grid-template-columns:46px 1fr;gap:8px}
    .arch-row .j{grid-column:2;order:3;color:var(--muted)}}
</style>
</head>

    calloutR:"<b>수집 방법 안내:</b> 이번 회차는 <b>2026-09-07 ~ 2026-09-14</b> 구간을 Crossref API로 전수 스윕해 구성했습니다. <b>구간이 직전 회차와 겹칩니다</b> — 직전 데이터 회차가 9월 10일자였으므로 간격이 4일에 불과해, 규정대로 최소 7일로 넓히면서 9/7~9/10이 중복 구간이 됐습니다. 다만 실제로 다시 실린 논문은 31건 중 1건(JACS의 O3 양극 온라인 정량)뿐이며, 나머지 30건은 이번에 처음 싣습니다. 연구·업계 배열은 매 회차 전량 교체되며 이월된 항목은 없습니다. <b>날짜의 의미</b> — Crossref의 게재일은 호(issue) 배정일이라 온라인 선공개보다 수 주에서 수 개월 늦을 수 있습니다. 이번 회차 실례로 J. Electrochemical Society의 4695 전해액량 논문은 Crossref 기준 9월 8일이지만 OpenAlex 기준 8월 28일, 나트륨 파우치셀 벤치마킹 논문은 9월 9일에 8월 31일, 열폭주 리뷰는 9월 8일에 8월 28일이었습니다. 구간 안에 들어왔다는 것이 곧 ‘이번 주에 처음 나왔다’는 뜻은 아닙니다. <b>ISSN 점검</b> — 연구 22종과 아카이브 11종에서 중복을 뺀 27개 ISSN을 모두 개별 조회해 반환 제목이 일치함을 확인했고, 탈락한 저널은 없습니다(JACS·Angewandte·JES 3건은 저희 표기가 약칭일 뿐 저널은 동일합니다). <b>절단 점검</b> — 전체 841건을 회수했고 모든 저널에서 total-results와 실제 회수 건수가 정확히 일치했으며 1000건 상한에 근접한 저널도 없어, 이번 회차에는 절단 경고가 없습니다. <b>Elsevier 계열은 이번에 전부 0건이었습니다</b> — Energy Storage Materials·Joule·Nano Energy·J. Power Sources·J. Energy Chemistry는 Crossref에 월 단위 게재일만 등록하고 그 값이 그 달 1일로 해석되는데, 이번 구간이 9월 7일에 시작하므로 다섯 저널 모두 걸리지 않았습니다(직전 회차와 정반대 상황입니다). Energy &amp; Environmental Science, Batteries &amp; Supercaps, Nature Reviews Materials도 등록분이 0건이었습니다. 그 결과 <b>초록 없이 제목만으로 쓴 설명은 31건 중 1건</b>(Nature Energy의 Li–S2Cl2 논문)뿐입니다. <b>⚠ arXiv 스윕 실패</b> — arXiv API가 https·http 양쪽에서 HTTP 429와 503을 반환해 12회 재시도에도 조회하지 못했습니다(세 회차 연속). 따라서 이번 회차 프리프린트도 <b>ChemRxiv 단독</b>이며, 293건을 전량 회수(절단 없음)해 배터리 관련 24건을 추린 뒤 4건을 실었습니다. <b>선별 규칙</b> — 저널당 최대 4건으로 제한했고(Angewandte·Small·Advanced Energy Materials·J. Electrochemical Society·ChemRxiv 다섯이 상한 4건), 11개 저널·프리프린트 서버에 걸쳐 있습니다. <b>소속 확인</b> — OpenAlex의 제1저자 기관을 기본으로 하되, 명백히 틀린 5건은 Crossref 원문 소속을 읽어 정정했습니다(Angewandte 논문을 ‘Lithium Power (United States)’로, Advanced Energy Materials 논문을 ‘지난대·말레이시아 교육부’로, JACS 논문을 중국과학원 대신 ‘중국공학원’으로, ChemRxiv 안티페로브스카이트 논문을 ‘Boeing (Spain)’으로 반환했고, ChemRxiv 흐름전지 논문은 OpenAlex에 기록이 없어 404였습니다). 4695 논문의 제1저자는 BMW와 뮌스터대 양쪽 소속이 병기돼 있어 둘 다 적었습니다 — 추정해서 적은 소속은 없습니다.",
    calloutI:"<b>검증 유의:</b> 업계 10건(국내 4 · 해외 6)은 모두 이번 회차에 직접 열어 읽은 기사에서 가져왔고, 발행일이 <b>9/7~9/14 구간 안에서 확정</b>되어 전부 ✓로 표기했습니다 — 월 단위까지만 확인된 △ 항목은 없습니다. 이번 주의 축은 <b>계통용 저장 설비 투자</b>였습니다. 바텐팔이 폐원전 부지에 254MW·1,000MWh 최종투자결정을 내렸고, 스위스 최대 BESS가 가동에 들어갔으며, 인도에서는 12GWh 제조 합작과 NTPC의 나트륨이온 실증 공모가 같은 주에 나왔습니다. 10건 중 5건이 ‘공장/공정’으로 몰린 것은 분류를 억지로 맞춘 결과가 아니라 이번 주 뉴스가 실제로 그쪽으로 쏠렸기 때문입니다. 국내는 LG에너지솔루션의 LMR 성과(40Ah급 883 사이클 92.2%), 삼성SDI의 인디애나 선그로우 전용 LFP 라인, KF-21 배터리 국산화, 그리고 비중국 시장 점유율 27.2%로의 후퇴 네 건입니다. <b>구간 밖이라 싣지 않은 것</b> — 검색 과정에서 확인했으나 발행일이 9월 7일 이전이라 제외한 건이 여럿입니다: LG에너지솔루션–스맥오버 리튬 10년 오프테이크(8/31), SK온–네오볼타 LFP 9GWh 공급계약(8/31), ProLogium의 381 Wh/kg 전고체 양산 개시(9/2), CATL 데브레첸 공장 니켈 노출 가동중단(8/25~9/2), HiNa–볼타 나트륨이온 10GWh(서명 9/2)입니다. 날짜를 정직하게 지키기 위해 여기에만 적어 둡니다. <b>확인하지 못한 것</b> — 포스코퓨처엠의 LFP 양극재 19만 톤 정식계약은 3분기 체결 예정으로 공고됐으나 이번 구간에도 체결을 확인하지 못했고(세 회차 연속), 전력거래소의 ESS 중앙계약시장 입찰 공고도 확인하지 못했습니다. 에코프로비엠·엘앤에프·포스코홀딩스·SK온과 Panasonic·Northvolt·QuantumScape·Toyota·Umicore·BASF·StoreDot·Tesla도 이번 구간 신규 소식을 검색으로 확인하지 못했습니다. <b>검색 결과가 틀렸던 건</b> — 한 검색 요약이 인터배터리 2026의 9월 11일 개막을 보도했다고 제시했으나 공식 사이트 확인 결과 해당 전시는 3월 11~13일이었으므로 싣지 않았습니다. 육군 교육용 드론 국산 배터리 건도 직전 회차에 이미 실은 것과 같은 사안이라 재수록하지 않았습니다. 상단 KPI 1·2·3은 모두 이번 구간에서 확인된 수치로 교체했습니다. 차트 2의 분기 영업이익은 이번 구간에 새로 보고된 국내 실적이 없어 2분기 수치를 그대로 두었습니다.",
    calloutA:"<b>연간 아카이브:</b> Nature·Science 및 자매지, Joule 등 최상위 11개 저널에 발표된 이차전지 논문을 연간 누적합니다. 주간 탭과 달리 매주 갱신되어도 지워지지 않습니다. <b>이번 회차(2026-09-14)에는 1건을 추가해 199건에서 200건이 되었습니다</b> — 기존 항목은 순서와 내용 모두 그대로이며, 삭제되거나 수정된 항목은 없습니다. 추가분은 Nature Energy의 리튬–이염화이황 전지 1건입니다. <b>이번 구간에 이차전지 논문이 0건이었던 저널</b> — Nature, Science, Nature Materials, Nature Nanotechnology, Nature Chemistry, Nature Catalysis, Nature Sustainability, Nature Reviews Materials, Science Advances, Joule 열 곳입니다(Joule과 Nature Reviews Materials는 아예 등록분 자체가 0건이었고, Joule은 Elsevier의 월 단위 게재일이 9월 1일로 해석되면서 이번 구간에 걸리지 않은 것입니다). 매우 조용한 한 주였습니다. <b>범위 밖으로 제외한 것</b> — Science의 연료전지 양성자 전달, Nature Chemistry의 Janus 팔라듐 막 CO2 환원, Nature Catalysis의 알칼리 수소발생 논문 2건, Nature Energy의 증발 구동 발전은 모두 이차전지가 아닙니다. Science Advances에서는 유전 엘라스토머, 유전분극·이온수송 에너지 변환, 폴리다이사이클로펜타다이엔 복합재 재활용, 마찰 플라즈마 에너지 하베스팅을 제외했고, <b>‘수상돌기 축소가 뉴런의 시냅스 통합을 형성한다’는 신경과학 논문</b>도 걸러냈습니다 — dendrite 키워드 스윕이 반드시 끌고 오는 대표적인 오탐입니다. 앞선 회차와 마찬가지로 nature.com의 편집자 큐레이션 페이지는 자동 접근이 차단돼(HTTP 303 → idp.nature.com, 이번에도 동일하게 실패했고 .weekly-update.log에 기록했습니다) <b>★ 표시는 Crossref 신호만으로 추론한 과소 표기</b>입니다 — 실제 편집자 지면이 ★ 없이 남아 있을 수 있고 그 반대는 없습니다. 이번 추가분은 저자가 16명이라 ‘저자 2명 이하’ 규칙에 걸리지 않아 ★로 판정되지 않았습니다.",
    footSrc:"<b>출처(Sources):</b> 각 카드의 링크를 참조하세요. 이번 회차 연구 항목은 Crossref API를 통해 Nature Energy, Advanced Materials, Angewandte Chemie, ACS Energy Letters, JACS, Small, Advanced Energy Materials, J. Electrochemical Society, Chemistry of Materials, ACS Nano에서 확인했고, 프리프린트는 ChemRxiv에서 가져왔습니다(arXiv는 HTTP 429·503으로 접근하지 못했습니다). 소속 정보는 OpenAlex를 기본으로 하고 5건은 Crossref 원문 소속으로 정정했습니다. 업계 항목은 한국경제, 파이낸셜뉴스, 디일렉(THE ELEC), 리드경제, ESS News, pv magazine, Renewable Watch, electrive, 그리고 바텐팔 보도자료에서 확인했습니다.",

    calloutR:"<b>How these were collected:</b> this edition was assembled from a full Crossref API sweep of <b>7 to 14 September 2026</b>. <b>The window overlaps the previous edition</b> — the last data edition was dated 10 September, only four days earlier, so widening it to the required seven-day minimum makes 7–10 September a repeat stretch. In practice only one of the 31 items actually recurs (the JACS paper on online lattice-sodium quantification); the other 30 appear here for the first time. The research and industry arrays are replaced wholesale every edition and nothing is carried over. <b>What the dates mean</b> — a Crossref publication date is the issue-assignment date, which can post-date online-first availability by weeks or months. Concrete cases this edition: the Journal of The Electrochemical Society paper on electrolyte quantity in 4695 cells carries a Crossref date of 8 September against 28 August in OpenAlex, the sodium pouch-cell benchmarking paper 9 September against 31 August, and the thermal-runaway review 8 September against 28 August. Falling inside the window does not mean the work first appeared this week. <b>ISSN check</b> — all 27 distinct ISSNs across the 22 research journals and 11 archive journals were queried individually and every one returned the expected title; none was dropped. (Three — JACS, Angewandte and JES — differ only because our labels are abbreviations.) <b>Truncation check</b> — 841 records were retrieved in total, every journal returned exactly as many items as its total-results, and none came near the 1000-row cap, so there is no truncation warning this edition. <b>The Elsevier titles returned nothing at all this time</b> — Energy Storage Materials, Joule, Nano Energy, J. Power Sources and J. Energy Chemistry deposit month-precision publication dates that resolve to the first of the month, and because this window opens on 7 September none of the five was caught (the exact inverse of last edition). Energy &amp; Environmental Science, Batteries &amp; Supercaps and Nature Reviews Materials also deposited nothing. As a result <b>only one of the 31 items</b> — the Nature Energy Li–S2Cl2 paper — had to be described from its title alone with no abstract. <b>⚠ The arXiv sweep failed</b> — the arXiv API returned HTTP 429 and 503 over both https and http across twelve retries, the third edition running. Preprints therefore come from <b>ChemRxiv alone</b>: 293 records retrieved in full with no truncation, 24 of them battery-related, of which four were selected. <b>Selection</b> — no journal supplies more than four items (Angewandte, Small, Advanced Energy Materials, the Journal of The Electrochemical Society and ChemRxiv all sit at the cap of four), spread across 11 journals and preprint servers. <b>Affiliations</b> — taken from the first author's institution in OpenAlex, except for five that were plainly wrong and were corrected by reading the raw Crossref affiliation strings: OpenAlex returned the Angewandte paper as “Lithium Power (United States)”, the Advanced Energy Materials paper as the University of Jinan and the Malaysian Ministry of Education, the JACS paper as the Chinese Academy of Engineering rather than the Chinese Academy of Sciences, and the ChemRxiv antiperovskite paper as “Boeing (Spain)”, while the ChemRxiv flow-battery preprint has no OpenAlex record at all (HTTP 404). The first author of the 4695 paper carries both a BMW and a University of Münster affiliation, so both are given. No affiliation was guessed.",
    calloutI:"<b>Caveats:</b> all 10 industry items (4 Korean, 6 international) come from articles opened and read this run, and every one has a publication date <b>confirmed inside the 7–14 September window</b>, so all are marked ✓ — there are no month-only △ items this edition. The spine of the week was <b>grid storage capital spending</b>. Vattenfall took a final investment decision on 254MW/1,000MWh at a decommissioned nuclear site, Switzerland's largest BESS came online, and India produced both a 12GWh manufacturing joint venture and NTPC's sodium-ion demonstration tender in the same week. Five of the ten items landing under “Plants” is not a classification forced to fit — it is where the week's news actually went. Korea supplied four: LG Energy Solution's LMR result (92.2% retention after 883 cycles in 40Ah-class cells), Samsung SDI's Sungrow-dedicated LFP line in Indiana, the localisation of KF-21 fighter batteries, and the retreat to a 27.2% share of the non-China market. <b>Found but out of window</b> — several items surfaced in the search and were excluded because they were published before 7 September: LG Energy Solution's ten-year lithium offtake with Smackover Lithium (31 Aug), SK On's 9GWh LFP supply deal with NeoVolta (31 Aug), ProLogium starting mass production of a 381 Wh/kg solid-state cell (2 Sep), the nickel-exposure suspension at CATL's Debrecen plant (25 Aug–2 Sep), and HiNa's 10GWh sodium-ion agreement with Volta (signed 2 Sep). Rather than bend the dates they are recorded here only. <b>What could not be confirmed</b> — POSCO Future M's 190,000-tonne LFP cathode contract was announced as due for signature in Q3 but no signing was confirmed in this window either, now three editions running, and no Korea Power Exchange ESS central-contract tender could be confirmed. No in-window announcement was found for EcoPro BM, L&amp;F, POSCO Holdings or SK On, nor for Panasonic, Northvolt, QuantumScape, Toyota, Umicore, BASF, StoreDot or Tesla. <b>Where a search result was wrong</b> — one search summary reported InterBattery 2026 opening on 11 September, but the official site shows the exhibition ran 11–13 March, so it was not published. The Army training-drone localisation story is the same item already carried last edition and was not run again. KPI tiles 1, 2 and 3 were all replaced with figures confirmed in this window. Chart 2 keeps its Q2 figures: no Korean maker reported new quarterly results inside this window.",
    calloutA:"<b>Annual archive:</b> battery papers from Nature, Science, their sister journals and Joule — 11 top-tier titles — accumulated across the year. Unlike the weekly tabs, nothing here is removed on a later run. <b>This edition (14 September 2026) added 1 entry, taking the archive from 199 to 200</b>; every existing entry keeps its order and its text, and nothing was deleted or rewritten. The addition is Nature Energy's lithium–disulfur dichloride battery. <b>Journals that published no battery work in this window</b> — Nature, Science, Nature Materials, Nature Nanotechnology, Nature Chemistry, Nature Catalysis, Nature Sustainability, Nature Reviews Materials, Science Advances and Joule, ten of the eleven. (Joule and Nature Reviews Materials deposited no records at all; for Joule that is the Elsevier month-precision date resolving to 1 September and so falling outside this window.) It was a very quiet week. <b>Excluded as out of scope</b> — Science's proton transfer in fuel cells, Nature Chemistry's CO2 reduction on a Janus palladium membrane, two Nature Catalysis papers on alkaline hydrogen evolution, and Nature Energy's evaporation-driven electricity generation are none of them secondary batteries. From Science Advances we dropped dielectric elastomers, flexoelectric ion-transport energy conversion, poly(dicyclopentadiene) composite recycling and tribo-plasma energy harvesting — and <b>a neuroscience paper on how dendritic shaft constrictions shape synaptic integration in neurons</b>, the textbook false positive that any keyword sweep on “dendrite” drags in. As in earlier runs, nature.com's editor-curated page refuses automated access, returning HTTP 303 to idp.nature.com — it failed identically again this run and was logged in .weekly-update.log — so <b>★ was inferred from Crossref signals alone and is under-inclusive</b>: genuine front matter may sit here unmarked, though never the reverse. This edition's addition has 16 authors, so it does not meet the two-authors-or-fewer rule and was not marked ★.",
    footSrc:"<b>Sources:</b> see the link on each card. Research items in this edition were confirmed through the Crossref API at Nature Energy, Advanced Materials, Angewandte Chemie, ACS Energy Letters, JACS, Small, Advanced Energy Materials, the Journal of The Electrochemical Society, Chemistry of Materials and ACS Nano, with preprints taken from ChemRxiv (arXiv could not be reached: HTTP 429 and 503). Affiliations came from OpenAlex, with five corrected from the raw Crossref affiliation strings. Industry items were confirmed at the Korea Economic Daily, Financial News, THE ELEC, Lead Economy, ESS News, pv magazine, Renewable Watch, electrive and Vattenfall's own press release.",

  {cat:"소재",sub:"안티페로브스카이트",title:"Reversibility of (De)lithiation of Antiperovskite Li2FeOS through a Paracrystalline, Mixed-Valent Intermediate",org:"Kouoi 외 (CIC energiGUNE)",org_en:"Kouoi et al. (CIC energiGUNE)",
   journal:"ChemRxiv (preprint)",date:"2026-09-08",ver:true,link:"https://doi.org/10.26434/chemrxiv.15008493/v1",
   desc:"양이온 무질서와 이종 음이온을 동시에 갖는 안티페로브스카이트 Li2FeOS에서 GITT, operando XRD, 57Fe 뫼스바우어로 세 과정을 분리했습니다. 1.95 V 이상용액 반응과 2.30~2.55 V 고용체까지 약 1 Li로 제한하면 장거리 질서가 크게 무너져도 원래 결정 반사가 정확히 회복되지만, 2.6 V 위는 비가역입니다.",
   desc_en:"In the simultaneously cation-disordered and heteroanionic antiperovskite Li2FeOS, galvanostatic intermittent titration, operando X-ray diffraction and ex situ 57Fe Mössbauer spectroscopy separate three processes. Limiting cycling to the 1.95 V two-phase reaction and the 2.30–2.55 V solid solution — about one lithium per formula unit — recovers the pristine reflections exactly despite severe loss of long-range order, whereas anything above 2.6 V is irreversible."},
  {cat:"전극",sub:"프리소듐화",title:"Sodium Formate as a High-Capacity Cathode Presodiation Additive for Ultra-Stable Sodium-Ion Batteries",org:"Hu 외 (화중과기대)",org_en:"Hu et al. (Huazhong Univ. of Science and Technology)",
   journal:"Advanced Materials",date:"2026-09-08",ver:true,link:"https://doi.org/10.1002/adma.74935",
   desc:"촉매가 필요 없는 포름산나트륨(HCOONa)을 양극 첨가제로 써서 398 mAh/g의 나트륨 보상 용량을 냈습니다. HCOO−의 최고점유분자궤도가 카보네이트 용매보다 높아 먼저 산화되므로, 기존 촉매 분해형 첨가제가 남기던 비활성 성분과 원가 부담을 피하면서 하드카본 음극의 낮은 초기 쿨롱효율을 메웁니다.",
   desc_en:"Catalyst-free sodium formate (HCOONa) serves as a cathode additive delivering 398 mAh/g of sodium-compensation capacity. Because the HCOO− anion sits at a higher highest-occupied molecular orbital energy than carbonate solvents it oxidises preferentially, offsetting the low initial Coulombic efficiency of hard carbon anodes without the inert residue and cost that catalytic-decomposition additives carry."},
  {cat:"전극",sub:"실리콘 음극",title:"Crystalline vs. Amorphous Silicon Anode Overhang: Investigating the Anode Overhang in Silicon-Dominant (70 wt.%) Lithium Ion Batteries",org:"Bosch 외 (뮌헨공대)",org_en:"Bosch et al. (Technical Univ. of Munich)",
   journal:"J. Electrochemical Society",date:"2026-09-09",ver:true,link:"https://doi.org/10.1149/1945-7111/aea4fd",
   desc:"흑연에서 잘 알려진 음극 오버행 효과가 실리콘 주도(70 wt%) 셀에서는 어떻게 달라지는지를 결정질 실리콘·비정질 실리콘·오버행 없음 세 구성으로 비교했습니다. XRD 결과 보관 중에도 결정질 실리콘의 구조가 변하지 않아, 활성 영역에서 오버행 쪽 결정질 입자로 리튬이 넘어가지 않는다는 점이 확인됐습니다.",
   desc_en:"The anode overhang effect, well understood in graphite cells, is compared across crystalline silicon, amorphous silicon and no-overhang configurations in silicon-dominant (70 wt%) cells. X-ray diffraction shows that storage does not alter the crystal structure of the crystalline silicon in the overhang, indicating that no lithium migrates into those particles from the electrochemically active area."},
  {cat:"전극",sub:"도전재/구조",title:"Beyond Passive Conductor: Conductive Carbon Black Dictates Interfacial Chemistry in Hard Carbon Anodes for Sodium-Ion Batteries",org:"Meng 외 (중난대)",org_en:"Meng et al. (Central South Univ.)",
   journal:"Small",date:"2026-09-07",ver:true,link:"https://doi.org/10.1002/smll.75449",
   desc:"아세틸렌 블랙·Super P·케첸 블랙 세 상용 도전재를 미세구조와 계면 화학으로 분리해 보니, 도전재가 수동적 전도체가 아니라 SEI 형성을 능동적으로 좌우했습니다. 결함이 많은 SP와 다공성이 큰 KB는 전해액을 대량 분해하는 반면, 결정성이 높은 AB는 얇고 불완전한 Na2CO3 기반 SEI를 만들어 계면 저항을 최소화합니다.",
   desc_en:"Separating three commercial conductive carbon blacks — acetylene black, Super P and Ketjen black — by microstructure and interfacial chemistry shows they are not passive conductors but actively dictate SEI formation. Defective Super P and highly porous Ketjen black trigger extensive electrolyte decomposition, while highly crystalline acetylene black induces a thin, incomplete Na2CO3-based SEI that minimises interfacial impedance."},
  {cat:"전극",sub:"프리리튬화",title:"Precise and Rapid Prelithiation of Hard Carbon Anodes via Tuning the Solution Chemistry of Aryl–Lithium Reagents",org:"Tan 외 (우한대)",org_en:"Tan et al. (Wuhan Univ.)",
   journal:"Angewandte Chemie Int. Ed.",date:"2026-09-10",ver:true,link:"https://doi.org/10.1002/anie.2432431",
   desc:"다환 방향족 아릴리튬 시약의 용액 화학을 조절해 하드카본 음극의 화학적 프리리튬화를 정밀하고 빠르게 만들었습니다. 페난트렌-리튬/DME 조합의 전위 0.46 V가 하드카본의 비가역 리튬 저장 임계전위 0.47 V와 거의 맞아떨어져, 필요한 만큼만 리튬을 넣습니다.",
   desc_en:"Tuning the solution chemistry of polycyclic aryl–lithium reagents makes chemical prelithiation of hard carbon anodes both precise and fast. A phenanthrene-lithium/1,2-dimethoxyethane formulation sits at 0.46 V, almost exactly matching hard carbon's irreversible lithium-storage threshold of 0.47 V, so only the required amount of lithium is inserted."},
  {cat:"전극",sub:"후막 전극",title:"3D Printed Ordered Porous Architectures of Functional Metal Tellurides for Ultra-High Mass-Loaded Ammonium-Ion Batteries",org:"De 외 (오스트라바공대)",org_en:"De et al. (VSB – Technical Univ. of Ostrava)",
   journal:"Advanced Energy Materials",date:"2026-09-09",ver:true,link:"https://doi.org/10.1002/aenm.71567",
   desc:"통상 1~5 mg/cm²에 머무는 수계 암모늄이온 전지 전극의 담지량 한계를, 선택적 레이저 용융으로 만든 3D 프린팅 다공성 Ti6Al4V 골격에 Bi2-xSbxTe3를 결합해 끌어올렸습니다. 규칙적인 기공이 초고담지 전극에서 문제가 되는 이온 확산 제약을 완화합니다.",
   desc_en:"The mass-loading ceiling of aqueous ammonium-ion battery electrodes, conventionally 1–5 mg/cm², is raised by integrating Bi2-xSbxTe3 with a 3D-printed porous Ti6Al4V scaffold made by selective laser melting. The ordered porosity relieves the ion-diffusion limitation that otherwise accompanies ultrahigh mass loading."},
  {cat:"전극",sub:"Zn 금속 음극",title:"Regulating Zn2+ Desolvation and (002)-Oriented Deposition for Stable Zinc Metal Anodes",org:"Zhou 외 (안칭사범대)",org_en:"Zhou et al. (Anqing Normal Univ.)",
   journal:"Chemistry of Materials",date:"2026-09-07",ver:true,link:"https://doi.org/10.1021/acs.chemmater.6c00791",
   desc:"전기방사 후 열 이미드화로 아연박 위에 폴리이미드/UiO-66-NH2 복합 중간층을 3차원 다공 구조로 올렸습니다. 폴리이미드 망이 전기장을 균일화하고 아미노기를 가진 UiO-66-NH2의 규칙적 기공이 (002)면 우선 성장을 유도해, 수계 아연이온 전지의 수지상과 계면 부반응을 억제합니다.",
   desc_en:"Electrospinning followed by thermal imidisation places a three-dimensional porous polyimide/UiO-66-NH2 composite interlayer on zinc foil. The polyimide network homogenises the electric field while the amino-functionalised UiO-66-NH2 channels steer growth onto the (002) plane, suppressing the dendrites and interfacial side reactions that constrain aqueous zinc-ion batteries."},
  {cat:"셀",sub:"원통형 셀",title:"Influence of the Electrolyte Amount on the Aging Behavior of 4695 Lithium-Ion Batteries",org:"Zimmermann 외 (BMW·뮌스터대)",org_en:"Zimmermann et al. (BMW · Univ. of Münster)",
   journal:"J. Electrochemical Society",date:"2026-09-08",ver:true,link:"https://doi.org/10.1149/1945-7111/aea055",
   desc:"고Ni NMC 양극과 흑연-실리콘 복합 음극을 쓴 4695 셀에서 기공 충전율을 여덟 단계로 나눠 50 ℃·0.5C·0~80% SOC로 720 사이클을 돌렸습니다. 순환 열화만 보면 전해액 양과 무관하게 거의 같지만, 이후 급속충전 시험에서 충전율이 아주 낮거나 높은 셀이 리튬 석출로 급격히 무너졌습니다.",
   desc_en:"In 4695 cells with a high-nickel NMC cathode and a graphite–silicon composite anode, eight pore-filling ratios were cycled 720 times between 0% and 80% state of charge at 50 °C and 0.5C. Cyclic ageing was near-identical regardless of electrolyte quantity, but subsequent fast-charging tests exposed rapid failure through lithium plating at both very low and very high filling ratios."},
  {cat:"셀",sub:"셀 벤치마킹",title:"Can Layered Oxide/Hard Carbon Sodium-Ion Pouch Cells Outperform LFP/Graphite Cells for Solar Duty Cycle Applications?",org:"Ye 외 (달하우지대)",org_en:"Ye et al. (Dalhousie Univ.)",
   journal:"J. Electrochemical Society",date:"2026-09-09",ver:true,link:"https://doi.org/10.1149/1945-7111/aea0a6",
   desc:"O3형 층상산화물/하드카본 나트륨이온 파우치셀과 LFP/흑연 파우치셀을 20~55 ℃ 범위의 실제 태양광 정전력 구동 프로토콜로 맞붙였습니다. 40 ℃와 55 ℃에서는 나트륨이 용량유지에서 앞서고 상한을 3.8 V로 묶으면 40 ℃ 500일 뒤 97%를 유지하지만, 에너지밀도 격차 때문에 절대 에너지는 여전히 LFP가 우위입니다.",
   desc_en:"O3-type layered oxide/hard carbon sodium-ion pouch cells are set against conventional LiFePO4/graphite pouch cells under a realistic constant-power solar duty protocol spanning 20 °C to 55 °C. At 40 °C and 55 °C the sodium cells retain capacity better — 97% after 500 days at 40 °C when the upper cut-off is held to 3.8 V — but the underlying energy-density gap means LFP still delivers more absolute energy throughout."},
  {cat:"셀",sub:"수명 예측",title:"Generalizable Mechanism-Anchored Health Management for Lithium-Ion Batteries Across Complex Degradation Trajectories",org:"Tao 외 (샤먼대)",org_en:"Tao et al. (Xiamen Univ.)",
   journal:"Advanced Energy Materials",date:"2026-09-11",ver:true,link:"https://doi.org/10.1002/aenm.71572",
   desc:"온도·율속·전압 남용이 뒤엉킨 열화 경로를 분리하기 위해, 노화 조건 식별을 대리 과제로 삼아 LFP/흑연 셀의 3.3~3.4 V 충전 구간을 열화 민감 구간으로 특정했습니다. 여기서 뽑은 특징을 증분용량 지문과 연결하고 조건 인지형 혼합전문가 모델에 넣어, 분포가 달라져도 전이되는 건강 상태 표현을 만듭니다.",
   desc_en:"To disentangle ageing pathways driven by temperature, rate and voltage abuse, ageing-condition identification is used as a proxy task to pinpoint a degradation-sensitive 3.3–3.4 V charging window in LFP/graphite cells. Features drawn from that window are linked to incremental-capacity fingerprints and fed to a condition-aware soft mixture-of-experts model, giving a degradation representation that transfers under distribution shift."},
  {cat:"셀",sub:"급속충전",title:"Cluster-Directed Solvation Engineering for Dual-Interface Stabilized Gel Polymer Electrolytes Enabling High-Voltage and Fast-Charging Lithium-Ion Batteries",org:"Chen 외 (둥베이임업대)",org_en:"Chen et al. (Northeast Forestry Univ.)",
   journal:"Angewandte Chemie Int. Ed.",date:"2026-09-11",ver:true,link:"https://doi.org/10.1002/anie.3651820",
   desc:"4.3 V 위에서 무너지는 LiPF6 카보네이트 전해액 문제를 반응성 클러스터로 풀었습니다. 극성이 큰 MMDS가 이온-쌍극자 상호작용으로 PF6−를 붙잡아 양극 쪽 분해를 황 함유 무기질 CEI 형성으로 돌리고, LiDFOB가 1차 용매화 껍질을 재구성해 탈용매화를 빠르게 합니다.",
   desc_en:"The oxidative collapse of LiPF6 carbonate electrolytes above 4.3 V is addressed through reactive clusters: highly polar MMDS anchors PF6− by ion–dipole interaction, redirecting cathode-side decomposition toward a sulfur-containing inorganic-rich CEI, while LiDFOB rebuilds the primary Li+ solvation sheath to speed desolvation. Together they yield thin, dense inorganic-rich interphases on both electrodes."},
  {cat:"셀",sub:"전고체 셀",title:"Grain-Boundary Electronic Insulation and Interfacial Self-Passivation Synergistic Strategy for High-Performance All-Solid-State Lithium Batteries",org:"Bai 외 (창춘이공대)",org_en:"Bai et al. (Changchun Univ. of Science and Technology)",
   journal:"Small",date:"2026-09-10",ver:true,link:"https://doi.org/10.1002/smll.75699",
   desc:"황화물 고체전해질의 입계가 전자 누설 통로로 작동해 바로 그 자리에 리튬 수지상이 쌓인다는 점에 착안해, 건식 볼밀로 Li6PS5Cl 입계에 PTFE를 도입했습니다. 전자전도도를 낮춰 입계 전자 이동을 막는 동시에 리튬 금속과의 계면을 자기 부동태화합니다.",
   desc_en:"Starting from the observation that grain boundaries in sulfide solid electrolytes act as electron-leakage channels where lithium dendrites then deposit, PTFE is introduced into the grain boundaries of Li6PS5Cl by dry ball-milling. This lowers the electronic conductivity and blocks electron transport along the boundaries while self-passivating the interface against lithium metal."},
  {cat:"셀",sub:"고전압 전고체",title:"Cyano-Driven Solvation Structure Reconstruction and Interfacial Passivation for 4.5 V Solid-State Lithium Metal Batteries",org:"Wu 외 (난카이대)",org_en:"Wu et al. (Nankai Univ.)",
   journal:"Angewandte Chemie Int. Ed.",date:"2026-09-08",ver:true,link:"https://doi.org/10.1002/anie.3609669",
   desc:"고분자 고체전해질이 상온 Li+ 수송과 4.3 V 이상 내산화성에서 막히는 문제를, 에터 산소 고분자를 주재료에서 빼고 시아노아크릴레이트 접착제 함량을 조절하는 방식으로 다뤘습니다. Li+–C≡N 경쟁 배위가 1차 용매화 껍질을 재편해 낮은 장벽의 호핑 자리를 잇고, −C≡N이 전이금속 양이온을 붙잡아 계면을 안정화합니다.",
   desc_en:"The twin obstacles of sluggish room-temperature Li+ transport and poor oxidative stability above 4.3 V in solid polymer electrolytes are tackled by abandoning ether-oxygen polymers as the host and instead tuning the content of a cyanoacrylate adhesive. Competitive Li+–C≡N coordination reorganises the primary solvation shell into a continuous low-barrier hopping network, while the nitrile anchors transition-metal cations at the interface."},
  {cat:"셀",sub:"진단",title:"Disentangling Lithium Failure Mechanisms in Liquid Electrolytes by 2D Exchange Solid-State NMR",org:"Han 외 (칭화대)",org_en:"Han et al. (Tsinghua Univ.)",
   journal:"JACS",date:"2026-09-11",ver:true,link:"https://doi.org/10.1021/jacs.6c12458",
   desc:"2차원 교환 고체 NMR로 죽은 리튬과 SEI의 상대 기여, 그리고 SEI–죽은 리튬 교환 세기를 두 지표로 정의해, 이온 접촉 실패와 전자 접촉 실패를 구분했습니다. 에스터계 전해액에서는 죽은 리튬이 비활성 손실을 지배하면서도 이온 교환 경로는 남아 있어, 실패의 본질이 위스커의 전자적 고립임을 가리킵니다.",
   desc_en:"Two-dimensional exchange solid-state NMR defines two descriptors — the relative contribution of dead Li0 versus SEI, and the ratio of SEI–dead-Li0 exchange intensity to SEI — that separate ionic contact failure from electronic contact failure. In ester-based electrolytes dead Li0 dominates the inactive-lithium loss while ionic exchange pathways survive, pointing to electronic isolation of whiskers as the real failure mode."},
  {cat:"공정",sub:"리사이클링",title:"A Multifunctional Lithium Amide Salt for Circular Battery Recycling",org:"Peng 외 (칭화대)",org_en:"Peng et al. (Tsinghua Univ.)",
   journal:"ACS Energy Letters",date:"2026-09-10",ver:true,link:"https://doi.org/10.1021/acsenergylett.6c02134",
   desc:"잔류 수분이 LiPF6를 가수분해해 만드는 불산이 CEI를 망가뜨리는 고리를, 리튬 트리플루오로-N-메틸아세트아마이드(LiTFMA) 한 가지로 끊었습니다. 수분과 불산을 열역학적으로 포집해 열화된 전해액의 이온전도도와 리튬 이온 이동수를 되살리고, TFMA− 음이온이 얇고 균일한 질소 함유 CEI를 만들어 폐NCM811 전극을 재제조합니다.",
   desc_en:"The loop in which residual moisture hydrolyses LiPF6 into hydrofluoric acid that then degrades the cathode–electrolyte interphase is broken with a single additive, lithium trifluoro-N-methylacetamide. It scavenges moisture and HF thermodynamically, restoring the ionic conductivity and lithium transference number of degraded electrolyte, while the TFMA− anion builds a thin, uniform nitrogen-containing CEI that lets retired NCM811 electrodes be remanufactured."},
  {cat:"공정",sub:"건식 코팅",title:"Environmental benefits and trade-offs of dry coating for battery electrode production",org:"Serra 외 (Empa)",org_en:"Serra et al. (Empa)",
   journal:"ChemRxiv (preprint)",date:"2026-09-09",ver:true,link:"https://doi.org/10.26434/chemrxiv.15008600/v1",
   desc:"건식 코팅이 정말 친환경인지를 전과정평가로 따졌습니다. 결과는 대체로 유리하지만 단서가 붙습니다 — 평가한 모든 영향 범주에서 환경부하가 줄어드는 한편, PVDF 바인더를 PTFE로 바꾸면서 오존층 파괴 잠재력만 1.8배로 늘었습니다. 건식 공정을 ‘무조건 더 깨끗한 공정’으로 부르기는 어렵다는 뜻입니다.",
   desc_en:"A life-cycle assessment asks whether dry coating really is the greener route. The answer is mostly yes with one caveat: impacts fall across every assessed category except ozone depletion potential, which rises by a factor of 1.8 when the PVDF binder is replaced by PTFE. Calling the dry process unconditionally cleaner is therefore not supportable."},
  {cat:"공정",sub:"슬러리 레올로지",title:"Interplay of Adsorbed and Free Polymer Governs Microstructure and Processability of Battery Slurries",org:"Gwag 외 (서울대)",org_en:"Gwag et al. (Seoul National Univ.)",
   journal:"ACS Nano",date:"2026-09-10",ver:true,link:"https://doi.org/10.1021/acsnano.6c10201",
   desc:"CMC 바인더가 슬러리 안에서 흡착 상태와 자유 상태로 동시에 존재한다는 점에 주목해, 분자량과 농도를 계통적으로 바꿔 두 역할을 분리했습니다. 전기화학적 기여가 거의 없는 소량의 바인더가 콜로이드 안정성, 코팅 중 유동성, 활물질 분산을 어떻게 좌우하는지 정리합니다.",
   desc_en:"Taking as its starting point that CMC binder coexists in adsorbed and free (non-adsorbed) states within the slurry, the study systematically varies molecular weight and concentration to decouple the two roles. It sets out how a binder that contributes almost nothing electrochemically nonetheless governs colloidal stability, flow during coating and the uniform distribution of active material."},
  {cat:"공정",sub:"공정 분석",title:"Online Quantification of Lattice Sodium for O3-Type Cathode Diagnostics during Scalable Manufacturing",org:"Su 외 (중국과학원)",org_en:"Su et al. (Chinese Academy of Sciences)",

          "name": "한국산업기술기획평가원 (KEIT)",
          "name_en": "KEIT",
          "url": "https://srome.keit.re.kr/srome/biz/perform/opnnPrpsl/retrieveTaskAnncmListView.do?prgmId=XPG201040000"
        },
        {
          "name": "한국에너지기술평가원 (KETEP)",
          "name_en": "KETEP",
          "url": "https://www.ketep.re.kr/businessAcment?menuId=MENU002080200000000"
        }
      ]
    }
  
};

/* ================= STATE & HELPERS ================= */
let lang="en", rCat="전체", iReg="전체", rQ="", iQ="", aJ="전체";
/* Student sections: filter state, plus the live copy of each feed. Seeded from
   the inline arrays above so the three tabs render on first paint — including
   over file://, where fetch is blocked. loadStudentData swaps in data/*.json
   when that fetch succeeds, and sets .stale when it does not. */
let jF="전체", pF="전체", gF="전체";
const STUDENT={
  jobs:{...SECMETA.jobs,items:jobs},
  postdoc:{...SECMETA.postdoc,items:postdoc},
  grants:{...SECMETA.grants,items:grants}
};
const T=()=>I18N[lang];
const CATCLR={"소재":"var(--s1)","전극":"var(--s2)","셀":"var(--s3)","공정":"var(--s4)","저널":"var(--s5)"};
const REGCLR={"국내":"var(--s1)","해외":"var(--s2)"};
/* Badge colours for the student sections. Keys are the `group` literals used in
   data/jobs.json, data/postdoc.json and data/grants.json; anything else falls back. */
const GRPCLR={"LG에너지솔루션":"var(--s1)","삼성SDI":"var(--s2)","SK온":"var(--s3)",
  "미국":"var(--s1)","영국":"var(--s2)","독일":"var(--s3)",
  "접수중":"var(--s1)","재확인 필요":"var(--s4)"};
const badge=(t,c,bg)=>`<span class="badge" style="color:${c};background:${bg}">${t}</span>`;
const tint=v=>`color-mix(in srgb, ${v} 14%, transparent)`;
const verBadge=v=>v?`<span class="verified">${T().ver}</span>`:`<span class="unverified">${T().unver}</span>`;
const catLbl=c=>CATLBL[c][lang], regLbl=r=>REGLBL[r][lang];
const subLbl=s=>lang==="en"?(SUBLBL[s]||s):s;
const typeLbl=t=>TYPELBL[t]?TYPELBL[t][lang]:t;
const compLbl=c=>lang==="en"?(COMPANY_EN[c]||c):c;
/* {ko,en} blob -> current language; and item field -> its _en variant in English. */
const pick=o=>o?(o[lang]||o.ko||""):"";
const sLbl=(o,f)=>lang==="en"?(o[f+"_en"]||o[f]||""):(o[f]||"");

/* ================= RENDER ================= */
function applyStatic(){
  const t=T();
  document.documentElement.lang=lang;
  const set=(id,v)=>{document.getElementById(id).innerHTML=v;};
  set('mhRole',t.mhRole); set('eyebrow',t.eyebrow); set('h1txt',t.h1); set('subLine',t.sub);
  set('k1l',t.k1l); set('k1v',t.k1v); set('k1n',t.k1n);
  set('k2l',t.k2l); set('k2n',t.k2n); set('k3l',t.k3l); set('k3n',t.k3n); set('k4l',t.k4l);
  set('tabR',t.tabR); set('tabI',t.tabI); set('tabC',t.tabC); set('tabA',t.tabA);
  set('tabJ',t.tabJ); set('tabP',t.tabP); set('tabG',t.tabG);
  set('cc1t',t.cc1t); set('cc1c',t.cc1c); set('cc2t',t.cc2t); set('cc2c',t.cc2c);
  set('cc3t',t.cc3t); set('cc3c',t.cc3c); set('cc4t',t.cc4t); set('cc4c',t.cc4c);
  set('calloutR',t.calloutR); set('calloutI',t.calloutI); set('calloutA',t.calloutA);
  set('footSrc',t.footSrc); set('footNote',t.footNote);
  document.getElementById('totalCount').textContent=research.length+industry.length;
  document.getElementById('totalNote').textContent=t.k4n(research.length,industry.length);
  updateThemeBtn();
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}
function updateThemeBtn(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').textContent=dark?T().toLight:T().toDark;
}
function renderResearch(){
  const box=document.getElementById('researchCards'); const q=rQ.toLowerCase();
  const items=research.filter(r=>(rCat==="전체"||r.cat===rCat)&&(!q||(r.title+r.desc+(r.desc_en||"")+(r.org||"")+r.journal+r.sub).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(r=>{
    const c=CATCLR[r.cat];
    const title=lang==="en"&&r.title_en?r.title_en:r.title;
    const org=lang==="en"&&r.org_en?r.org_en:r.org;
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card">
      <div class="badges">${badge(catLbl(r.cat),c,tint(c))}${badge(subLbl(r.sub),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${title}</h4>
      <div class="meta"><b>${r.journal}</b> · ${org}</div>
      <p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkR}</a></div></div>`;
  }).join('');
}
function renderIndustry(){
  const box=document.getElementById('industryCards'); const q=iQ.toLowerCase();
  const items=industry.filter(r=>(iReg==="전체"||r.region===iReg)&&(!q||(r.company+(COMPANY_EN[r.company]||"")+r.desc+(r.desc_en||"")+r.type).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(r=>{
    const c=REGCLR[r.region];
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card">
      <div class="badges">${badge(regLbl(r.region),c,tint(c))}${badge(typeLbl(r.type),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${compLbl(r.company)}</h4><p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkI}</a></div></div>`;
  }).join('');
}
function renderArchive(){
  const box=document.getElementById('archiveList');
  const items=archive.filter(x=>aJ==="전체"||x.journal===aJ);
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  const byMonth={};
  items.forEach(x=>{const m=x.date.slice(0,7);(byMonth[m]=byMonth[m]||[]).push(x);});
  box.innerHTML=Object.keys(byMonth).sort().reverse().map(m=>{
    const rows=byMonth[m].slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(x=>{
      const c=CATCLR[x.cat]||'var(--ink-2)';
      const org=lang==="en"&&x.org_en?x.org_en:x.org;
      const desc=lang==="en"?x.desc_en:x.desc;
      /* Joule deposits month-only dates to Crossref; the month header already carries that,
         so show a dash rather than a two-digit month masquerading as a day. */
      const day=x.date.length>7?x.date.slice(5):"—";
      return `<div class="arch-row">
        <div class="d">${day}</div>
        <div class="j" style="color:${c}">${x.journal}</div>
        <div class="t">
          ${x.nv?'<span class="arch-star" title="News &amp; Views">★</span>':''}
          <a href="${x.link}" target="_blank" rel="noopener">${x.title}</a>
          <span class="who"> · ${org}</span>
          <span class="sum">${desc}</span>
        </div></div>`;
    }).join('');
    return `<div class="arch-month"><h3>${m}</h3><span class="n">${byMonth[m].length}</span></div>${rows}`;
  }).join('');
}
function renderFilters(){
  const rCats=["전체","소재","전극","셀","공정","저널"];
  document.getElementById('researchFilters').innerHTML=
    rCats.map(c=>`<button class="chip${c===rCat?' active':''}" data-rc="${c}">${catLbl(c)} <span style="opacity:.7">${c==="전체"?research.length:research.filter(x=>x.cat===c).length}</span></button>`).join('')
    +`<input class="search" id="rSearch" placeholder="${T().searchR}" value="${rQ.replace(/"/g,'&quot;')}">`;
  const iRegs=["전체","국내","해외"];
  document.getElementById('industryFilters').innerHTML=
    iRegs.map(c=>`<button class="chip${c===iReg?' active':''}" data-ir="${c}">${regLbl(c)} <span style="opacity:.7">${c==="전체"?industry.length:industry.filter(x=>x.region===c).length}</span></button>`).join('')
    +`<input class="search" id="iSearch" placeholder="${T().searchI}" value="${iQ.replace(/"/g,'&quot;')}">`;
  document.getElementById('rSearch').addEventListener('input',e=>{rQ=e.target.value;renderResearch();});
  document.getElementById('iSearch').addEventListener('input',e=>{iQ=e.target.value;renderIndustry();});
  const aCount={};archive.forEach(x=>{aCount[x.journal]=(aCount[x.journal]||0)+1;});
  const aJournals=["전체"].concat(Object.keys(aCount).sort((a,b)=>aCount[b]-aCount[a]||a.localeCompare(b)));
  document.getElementById('archiveFilters').innerHTML=
    aJournals.map(j=>`<button class="chip${j===aJ?' active':''}" data-aj="${j}">${j==="전체"?catLbl("전체"):j} <span style="opacity:.7">${j==="전체"?archive.length:aCount[j]}</span></button>`).join('');
}
function hbar(container,rows,unit){
  const max=Math.max(...rows.map(r=>Math.abs(r.v)));
  document.getElementById(container).innerHTML=rows.map(r=>{
    const w=Math.max(2,Math.abs(r.v)/max*100);
    return `<div class="bar-row"><div class="name">${r.n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${r.c||'var(--s1)'}"></div></div>
      <div class="num">${r.v.toLocaleString()}${unit||''}</div></div>`;}).join('');
}
function renderCharts(){
  const t=T();
  hbar('chartCat',["소재","전극","셀","공정","저널"].map(c=>({n:catLbl(c),v:research.filter(x=>x.cat===c).length,c:CATCLR[c]})),t.unitCount);
  hbar('chartEarnings',[
    {n:compLbl("SK온"),v:8218},{n:compLbl("삼성SDI"),v:2038},{n:compLbl("LG에너지솔루션"),v:1133},
    {n:compLbl("포스코퓨처엠"),v:267},{n:compLbl("엘앤에프"),v:208},{n:compLbl("에코프로비엠"),v:180}].map(r=>({...r,c:"var(--s1)"})),t.unitEok);
  const nt={};industry.forEach(i=>{nt[i.type]=(nt[i.type]||0)+1;});
  hbar('chartNews',Object.entries(nt).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n:typeLbl(n),v,c:"var(--s3)"})),t.unitCount);
  document.getElementById('themeList').innerHTML=t.themes
    .map(([k,v])=>`<div><span style="color:var(--amber);font-weight:800">▸</span> <b style="color:var(--ink)">${k}</b> — ${v}</div>`).join('');
}
/* ---- Student sections: 채용 / 포닥 / 과제 ----------------------------------
   These three panels render from data/*.json rather than from inline arrays, so a
   weekly pipeline only has to rewrite the JSON. They share one card template; the
   per-file differences live in the data, not here. */
function studentNotice(id,d){
  const box=document.getElementById(id);
  const stale=d.stale?` <span style="color:var(--serious)">${T().seedStale}</span>`:'';
  box.innerHTML=`<b>${pick(d.notice)}</b> <span style="color:var(--muted)">· ${T().lastChecked(d.updated)}</span>${stale}<br>${pick(d.context)}`;
}
function studentPortals(id,d){
  const box=document.getElementById(id);
  if(!d||!d.portals){box.innerHTML="";return;}
  const links=d.portals.map(p=>
    `<a href="${p.url}" target="_blank" rel="noopener" style="color:var(--brand-ink);text-decoration:none;font-weight:600">${lang==="en"?(p.name_en||p.name):p.name} ↗</a>`
  ).join(' <span style="color:var(--muted)">·</span> ');
  box.innerHTML=`<b>${pick(d.portals_title)}</b><br>${links}`;
}
const grpLbl=(d,k)=>{if(lang!=="en")return k;const it=d.items.find(x=>x.group===k);return it&&it.group_en?it.group_en:k;};
function studentFilters(id,d,attr,cur){
  const box=document.getElementById(id);
  if(!d||!d.items){box.innerHTML="";return;}
  const keys=["전체"].concat([...new Set(d.items.map(x=>x.group))]);
  box.innerHTML=keys.map(k=>{
    const label=k==="전체"?(lang==="en"?"All":"전체"):grpLbl(d,k);
    return `<button class="chip${k===cur?' active':''}" data-${attr}="${k}">${label}</button>`;
  }).join('');
}
function studentCards(id,d,cur){
  const box=document.getElementById(id);
  const items=(d.items||[]).filter(x=>cur==="전체"||x.group===cur);
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(x=>{
    const c=GRPCLR[x.group]||'var(--ink-2)';
    const st=x.ok?`<span class="verified">${T().stOk}</span>`:`<span class="unverified">${T().stCheck}</span>`;
    /* What the link promises has to match where it goes. link_type="deep" means the
       URL opens the posting itself; "search" and "portal" mean it does not, so the
       label names the search term instead of implying a posting is one click away.
       Some entries genuinely have no URL at all (an expired listing with no
       replacement) — render the card without a link rather than inventing one. */
    const deep=x.link_type==="deep";
    const q=sLbl(x,'query')||sLbl(x,'title');
    const label=deep?T().linkDeep:T().linkSearch(q);
    const link=x.link?`<a class="link${deep?'':' soft'}" href="${x.link}" target="_blank" rel="noopener">${label}</a>`:'';
    return `<div class="card">
      <div class="badges">${badge(sLbl(x,'group'),c,tint(c))}${badge(sLbl(x,'tag'),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${sLbl(x,'title')}</h4>
      <div class="meta"><b>${sLbl(x,'meta')}</b></div>
      <p>${sLbl(x,'desc')}</p>
      <div class="foot"><span class="date">${sLbl(x,'deadline')} · ${st}</span>${link}</div></div>`;
  }).join('');
}
function renderJobs(){const d=STUDENT.jobs;studentNotice('noticeJ',d);studentFilters('jobsFilters',d,'jf',jF);studentCards('jobsCards',d,jF);studentPortals('portalsJ',d);}
function renderPostdoc(){const d=STUDENT.postdoc;studentNotice('noticeP',d);studentFilters('postdocFilters',d,'pf',pF);studentCards('postdocCards',d,pF);studentPortals('portalsP',d);}
function renderGrants(){const d=STUDENT.grants;studentNotice('noticeG',d);studentFilters('grantsFilters',d,'gf',gF);studentCards('grantsCards',d,gF);studentPortals('portalsG',d);}
function loadStudentData(){
  const files={jobs:"data/jobs.json",postdoc:"data/postdoc.json",grants:"data/grants.json"};
  const redraw={jobs:renderJobs,postdoc:renderPostdoc,grants:renderGrants};
  Object.keys(files).forEach(k=>{
    fetch(files[k],{cache:"no-cache"})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(j=>{if(j&&Array.isArray(j.items)&&j.items.length)STUDENT[k]=j;})
      .catch(()=>{STUDENT[k].stale=true;})
      .then(()=>redraw[k]());
  });
}
function renderAll(){applyStatic();renderFilters();renderResearch();renderIndustry();renderArchive();renderCharts();renderJobs();renderPostdoc();renderGrants();}

/* ================= EVENTS ================= */
document.getElementById('researchFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-rc]');if(!b)return;
  rCat=b.dataset.rc;
  document.querySelectorAll('[data-rc]').forEach(x=>x.classList.toggle('active',x.dataset.rc===rCat));
  renderResearch();
});
document.getElementById('industryFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-ir]');if(!b)return;
  iReg=b.dataset.ir;
  document.querySelectorAll('[data-ir]').forEach(x=>x.classList.toggle('active',x.dataset.ir===iReg));
  renderIndustry();
});
document.getElementById('archiveFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-aj]');if(!b)return;
  aJ=b.dataset.aj;
  document.querySelectorAll('[data-aj]').forEach(x=>x.classList.toggle('active',x.dataset.aj===aJ));
  renderArchive();
});
document.getElementById('jobsFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-jf]');if(!b)return;
  jF=b.dataset.jf;renderJobs();
});
document.getElementById('postdocFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-pf]');if(!b)return;
  pF=b.dataset.pf;renderPostdoc();
});
document.getElementById('grantsFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-gf]');if(!b)return;
  gF=b.dataset.gf;renderGrants();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');}));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  updateThemeBtn();
});
document.getElementById('langSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;renderAll();
});

/* ================= INIT (dark + Korean by default) ================= */
renderAll();
loadStudentData();
</script>
