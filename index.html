<style>
  :root{
    color-scheme: light;
    --plane:#f4f4f2; --surface:#ffffff; --surface-2:#faf9f6;
    --ink:#0e0e0e; --ink-2:#4c4a45; --muted:#8a877f;
    --grid:#e5e3dd; --baseline:#c9c6bd; --border:rgba(14,14,14,0.10);
    --amber:#ffc000; --amber-deep:#8a6500; --brand-ink:#8a6500; --black:#0e0e0e;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
    --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --shadow:0 1px 2px rgba(14,14,14,.05),0 6px 20px rgba(14,14,14,.06);
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0a0a0a; --surface:#161615; --surface-2:#1d1d1b;
    --ink:#f7f6f3; --ink-2:#bdbab2; --muted:#8a877f;
    --grid:#2a2a27; --baseline:#3a3a36; --border:rgba(255,255,255,0.11);
    --amber:#ffc000; --amber-deep:#ffc000; --brand-ink:#ffc000; --black:#0e0e0e;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good:#0ca30c; --good-ink:#3fc55f; --warn:#fab219; --serious:#ec835a; --critical:#e2635f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--plane); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

  .masthead{
    background:var(--black); border-radius:16px; padding:18px 22px; margin-bottom:22px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.07);
    position:relative; overflow:hidden;
  }
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--amber)}
  .masthead img.logo{height:56px;width:auto;display:block;flex-shrink:0}
  .masthead .mh-mid{flex:1;min-width:180px}
  .masthead .mh-inst{font-size:12.5px;color:#b9b6ae;letter-spacing:.01em}
  .masthead .mh-role{font-size:13px;color:#fff;font-weight:600;margin-top:3px}
  .masthead .mh-by{
    font-size:12px;color:var(--amber);font-weight:700;letter-spacing:.02em;
    border:1px solid rgba(255,192,0,.42);border-radius:999px;padding:7px 14px;white-space:nowrap;
  }
  .masthead .mh-by small{display:block;font-size:10px;color:#8f8c85;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink)}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
  h1 .brk{color:var(--amber);font-weight:800}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:5px}
  .ctrls{display:flex;gap:8px;align-items:center}
  .theme-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;font-weight:600;
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--amber)}
  .lang-seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
  .lang-seg button{
    border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:8px 14px;cursor:pointer;transition:.12s;
  }
  .lang-seg button.active{background:var(--amber);color:#0e0e0e}
  .lang-seg button:not(.active):hover{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 4px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .kpi .accent{height:3px;border-radius:2px;margin-bottom:12px;width:32px;background:var(--amber)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:600}
  .kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.1}
  .kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2)}
  .kpi .note{font-size:12px;color:var(--ink-2);margin-top:6px}
  .kpi .note.up{color:var(--good-ink);font-weight:600}

  .tabs{display:flex;gap:4px;margin:26px 0 18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{
    border:none;background:none;font-family:inherit;font-size:14px;font-weight:600;
    color:var(--muted);padding:10px 15px;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:.15s;
  }
  .tab:hover{color:var(--ink-2)}
  .tab.active{color:var(--ink);border-bottom-color:var(--amber)}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .chart-card h3{font-size:14px;font-weight:700;margin-bottom:2px}
  .chart-card h3::before{content:"[ ";color:var(--amber);font-weight:800}
  .chart-card h3::after{content:" ]";color:var(--amber);font-weight:800}
  .chart-card .cap{font-size:12px;color:var(--muted);margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0}
  .bar-row .name{width:132px;font-size:12.5px;color:var(--ink-2);flex-shrink:0;text-align:right;font-weight:600;line-height:1.25}
  .bar-track{flex:1;background:var(--grid);border-radius:5px;height:22px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.7,.3,1)}
  .bar-row .num{width:72px;font-size:12.5px;font-weight:700;text-align:left;font-variant-numeric:tabular-nums}

  .filters{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px;align-items:center}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--ink-2);
    border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;
  }
  .chip:hover{border-color:var(--amber);color:var(--ink)}
  .chip.active{background:var(--amber);color:#0e0e0e;border-color:var(--amber)}
  .chipLbl{color:var(--ink-2);font-size:12px;font-weight:600;margin-right:2px}
  .bsrc{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);line-height:2}
  .search{
    margin-left:auto;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:8px 15px;font-size:13px;font-family:inherit;min-width:210px;
  }
  .search:focus{outline:2px solid var(--amber);outline-offset:1px}
  .search::placeholder{color:var(--muted)}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s;
    border-left:3px solid transparent;
  }
  .card:hover{border-color:var(--baseline);border-left-color:var(--amber);transform:translateY(-2px)}
  .card.is-new{border-left-color:var(--amber)}
  .card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .card h4{font-size:14px;font-weight:700;line-height:1.35;margin-bottom:7px}
  .card .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .card .meta b{color:var(--ink-2);font-weight:600}
  .card p{font-size:13px;color:var(--ink-2);line-height:1.55;flex:1}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px}
  .card .date{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card a.link{font-size:12px;font-weight:700;color:var(--brand-ink);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .card a.link:hover{text-decoration:underline}
  .briefH{font-size:14px;font-weight:800;margin:18px 0 10px;color:var(--brand-ink);letter-spacing:-.01em}
  .card a.link.soft{color:var(--muted);font-weight:600}
  .card a.link.soft:hover{color:var(--ink-2)}
  .verified{font-size:10.5px;color:var(--good-ink);font-weight:600}
  .unverified{font-size:10.5px;color:var(--serious);font-weight:600}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;font-size:13px}

  .callout{
    background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--amber);
    border-radius:10px;padding:13px 16px;font-size:12.5px;color:var(--ink-2);margin:20px 0 4px;line-height:1.6;
  }
  footer{margin-top:38px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.7}
  footer .sig{
    display:inline-block;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--ink);
    border-top:2px solid var(--amber);padding-top:7px;
  }
  footer .sig span{color:var(--amber)}
  @media(max-width:820px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid-2,.cards{grid-template-columns:1fr}
    .search{margin-left:0;width:100%}
    .masthead img.logo{height:42px}
  }

  /* ===== annual archive: compact rows, meant to be scanned ===== */
  .arch-month{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px;
    padding-bottom:6px;border-bottom:1px solid var(--border)}
  .arch-month h3{font-size:15px;font-weight:700}
  .arch-month .n{font-size:12px;color:var(--muted);font-weight:600}
  .arch-row{display:grid;grid-template-columns:52px 150px 1fr;gap:12px;align-items:start;
    padding:10px 8px;border-radius:8px;transition:.12s;border-left:2px solid transparent}
  .arch-row:hover{background:var(--surface);border-left-color:var(--amber)}
  .arch-row .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
  .arch-row .j{font-size:11px;font-weight:700;padding-top:2px;line-height:1.3}
  .arch-row .t{font-size:13.5px;line-height:1.45}
  .arch-row .t a{color:var(--ink);text-decoration:none;font-weight:600}
  .arch-row .t a:hover{color:var(--brand-ink);text-decoration:underline}
  .arch-row .t .sum{display:block;color:var(--ink-2);font-size:12.5px;font-weight:400;margin-top:3px}
  .arch-row .t .who{color:var(--muted);font-size:11.5px;font-weight:400}
  .arch-star{color:var(--amber);font-weight:800;margin-right:4px}
  @media(max-width:820px){.arch-row{grid-template-columns:46px 1fr;gap:8px}
    .arch-row .j{grid-column:2;order:3;color:var(--muted)}}
</style>
</head>

  {cat:"전극",sub:"바인더",title:"Investigation of Structure-Property-Performance Relationships of Binders in Graphitic Negative Electrodes for Lithium Ion Batteries on the Example of Systematically Modified Xanthan",org:"Albers 외 (뮌스터대 MEET)",org_en:"Albers et al. (MEET, Univ. of Münster)",

   desc_en:"Systematically modified xanthan-gum binders map how molecular structure drives adhesion, conductivity, paste rheology and performance in graphite anodes. More acetylation improves adhesion to copper, pyruvyl groups hurt adhesion and conductivity, and higher molecular weight improves shear-thinning and thixotropy."},
  {cat:"소재",sub:"고체전해질",title:"Function-Decoupled Dual-Anion Doping via Site-Preferential Regulation Enables High-Performance Lithium Argyrodite Electrolytes",org:"Shi 외 (상하이대)",org_en:"Shi et al. (Shanghai Univ.)",
   journal:"Advanced Energy Materials",date:"2026-11-23",ver:true,added:"2026-11-25",link:"https://doi.org/10.1002/aenm.71857",
   desc:"산소 전구체에 따라 O가 차지하는 자리가 달라진다는 계산 결과를 이용해, O는 16e 자리(대기 안정성·전위창)에, Se는 4d 자리(이온전도도)에 배치한 Li6PS4.2O0.4Se0.4Cl 아지로다이트를 설계했습니다. 임계전류밀도 2.6 mA/cm², Li 대칭셀 4000시간 이상 구동을 보였습니다.",
   desc_en:"Using DFT showing that the oxygen precursor decides which site O occupies, the authors design Li6PS4.2O0.4Se0.4Cl argyrodite with O on 16e sites for air stability and voltage window and Se on 4d sites for conductivity. It reaches a critical current density of 2.6 mA/cm² and cycles Li symmetric cells for over 4,000 h."},
  {cat:"셀",sub:"무음극 나트륨전지",title:"Steric Asymmetry-Induced Hyperconjugation Enables Stable Anode-Free Sodium Pouch Cells",org:"Chen 외 (시안교통대)",org_en:"Chen et al. (Xi’an Jiaotong Univ.)",
   journal:"Angewandte Chemie Int. Ed.",date:"2026-11-23",ver:true,added:"2026-11-25",link:"https://doi.org/10.1002/anie.8348441",
   desc:"비대칭 에테르 용매 EEME의 초공액 효과로 PF6⁻를 Na⁺ 용매화 구조 근처에 붙잡아 NaF가 풍부한 계면을 만들었습니다. 무음극 Al/C||Na4Fe3(PO4)2P2O7 파우치셀이 0.5C 1600사이클 후 85.9%를 유지했고 −20°C에서도 상온 용량의 98.6%를 냈습니다.",

  {cat:"공정",sub:"분리막",title:"Conformal amorphous TiOx coatings on nonwoven battery separators by atmospheric-pressure Mist CVD: Quantitative analysis of depth-dependent coating attenuation",org:"Yamamoto 외",org_en:"Yamamoto et al.",

  {cat:"소재",sub:"리튬과잉 양극",title:"Passivating the cathode-catholyte interface of Li-rich layered oxide via amorphous layer design for all-solid-state batteries",org:"Wang 외",org_en:"Wang et al.",

  {cat:"셀",sub:"리튬 석출",title:"Expansion-Pressure-Based Early Detection and Relative Severity Assessment of Lithium Plating in Prismatic LiFePO4/Graphite Batteries",org:"Xiong 외 (허페이공대)",org_en:"Xiong et al. (Hefei Univ. of Technology)",
   journal:"Small",date:"2026-11-24",ver:true,added:"2026-11-25",link:"https://doi.org/10.1002/smll.76782",
   desc:"32 Ah 각형 LFP/흑연 셀의 팽창 압력을 측정해 용량당 압력 변화(dP/dQ)로 저온 충전 중 리튬 석출 시작을 잡아내고, 온도 보상 임계값과 압력 곡선 특징으로 석출 정도까지 평가했습니다. 석출 셀은 이후 사이클에서 용량이 일부 회복돼 개입할 수 있는 구간이 있음을 보였습니다.",
   desc_en:"Expansion pressure in 32 Ah prismatic LFP/graphite cells, read as dP/dQ, flags the onset of lithium plating during low-temperature charging, and a temperature-compensated threshold plus pressure-curve features rank its severity. Plated cells partly recover capacity, revealing a window for intervention."},
  {cat:"소재",sub:"할라이드 고체전해질",title:"Exploring Superionic Migration in Halide Solid-State Electrolytes via Ta5+-driven Structural Evolution",org:"Liu 외",org_en:"Liu et al.",

   desc_en:"Explores superionic conduction in halide solid electrolytes through Ta5+-driven structural evolution."},
  {cat:"셀",sub:"나트륨 전고체",title:"Fast-Charging Sodium Solid-State Batteries Enabled by closo-Hydridoborate Anode Interlayers for Sulfide Electrolytes",org:"Schnaubelt 외 (기센대)",org_en:"Schnaubelt et al. (Univ. of Giessen)",
   journal:"ACS Energy Letters",date:"2026-11-24",ver:true,added:"2026-11-25",link:"https://doi.org/10.1021/acsenergylett.6c03131",
   desc:"closo-하이드리도보레이트 Na4(B10H10)(B12H12)를 황화물 전해질과 음극 사이 중간층으로 넣어 Na3SbS4·Na2.9P0.9W0.1S4 이중층 셀을 안정화했습니다. TiS2 양극 셀이 250사이클 동안 90% 이상을 유지했고, 80°C에서 30초 만에 SOC 0→50%까지 충전했습니다.",
   desc_en:"A closo-hydridoborate Na4(B10H10)(B12H12) interlayer between anode and sulfide electrolyte stabilizes Na3SbS4 and Na2.9P0.9W0.1S4 bilayer cells. TiS2-based cells keep over 90% for 250 cycles and charge from 0 to 50% SOC in 30 s at 80°C."},
  {cat:"소재",sub:"전해질 설계",title:"Differentiable Solvation Shell Model for Rational Electrolyte Design",org:"Zhao 외 (미시간대)",org_en:"Zhao et al. (Univ. of Michigan)",
   journal:"ACS Energy Letters",date:"2026-11-24",ver:true,added:"2026-11-25",link:"https://doi.org/10.1021/acsenergylett.6c02739",
   desc:"공여수·수용수·몰비·분자 크기로 Li⁺ 용매화 껍질을 예측하는 미분 가능한 평균장 이징 모델로, MD 결과를 10.7% RMSE로 재현하면서 계산 비용을 크게 줄였습니다. 학습에 없던 LiTFSI/테트라글라임 계에서 플루오로벤젠 희석제와 음이온 풍부 용매화 농도 구간을 예측해 MD로 확인했습니다.",
   desc_en:"An end-to-end differentiable mean-field Ising model predicts the Li⁺ solvation shell from donor and acceptor numbers, molar ratio and molecular size, reproducing MD shells at 10.7% RMSE for far less cost. For LiTFSI in tetraglyme, outside its training set, it picked fluorobenzene as diluent and an anion-rich concentration window that MD then confirmed."},
  {cat:"셀",sub:"전고체 계면 공극",title:"Contouring mitigates voiding at the lithium/ceramic electrolyte interface on discharging solid-state batteries",org:"Zhang 외",org_en:"Zhang et al.",
   journal:"Nature Energy",date:"2026-11-23",ver:true,added:"2026-11-24",link:"https://doi.org/10.1038/s41560-026-02172-w",
   desc:"Li/Li6PS5Cl 계면에 달걀판(egg-box) 형상의 요철을 넣어 방전 중 공극이 생기기 시작하는 전류를 2 MPa·30°C에서 0.2에서 2 mA/cm²로 10배 높였습니다. 공극을 완전히 없애지는 못하지만 성장과 분극을 억제해, 평탄 계면은 금방 실패하는 WLTP 기반 주행 방전 프로파일을 견뎠습니다.",
   desc_en:"An egg-box topography at the Li/Li6PS5Cl interface raises the discharge current at which voiding begins tenfold, from 0.2 to 2 mA/cm² at 2 MPa and 30°C. Voids still form but grow less, so contoured cells survive WLTP-derived driving discharge profiles that quickly kill flat interfaces."},
  {cat:"셀",sub:"나트륨-황 전고체",title:"Operando Pressure Monitoring, EIS, and X‐Ray Imaging of Solid‐State Sodium‐Sulfur Batteries — Insights into Chemo‐Mechanical Degradation Mechanisms",org:"Hoffknecht 외 (헬름홀츠 베를린)",org_en:"Hoffknecht et al. (Helmholtz-Zentrum Berlin)",
   journal:"Advanced Energy Materials",date:"2026-11-22",ver:true,added:"2026-11-24",link:"https://doi.org/10.1002/aenm.71844",
   desc:"셀 스택 압력, EIS, X선 이미징을 동시에 측정하는 오퍼란도 플랫폼으로 황화물계 전고체 나트륨-황 셀의 화학-기계적 열화를 추적했습니다. Na3PS4, Na2S-P2S5-NaCl, Na3SbS4 전해질 셀을 50사이클 동안 비교해 서서히 진행되는 열화를 압력·임피던스 변화와 연결했습니다.",
   desc_en:"A multi-modal operando platform that tracks stack pressure, EIS and X-ray images together follows chemo-mechanical aging in sulfide-based solid-state Na–S cells. Comparing Na3PS4, Na2S-P2S5-NaCl and Na3SbS4 electrolytes over 50 cycles ties slowly evolving degradation to pressure and impedance changes."},
  {cat:"소재",sub:"나트륨 층상 양극",title:"Synergistic Interfacial and Subsurface Stabilization of O3‐Type Na‐Ni‐Fe‐Mn‐O Cathodes through Integrated Zr Modification",org:"Han 외 (세종대)",org_en:"Han et al. (Sejong Univ.)",
   journal:"Advanced Energy Materials",date:"2026-11-22",ver:true,added:"2026-11-24",link:"https://doi.org/10.1002/aenm.71847",
   desc:"O3형 Na[Ni0.3Fe0.3Mn0.4]O2를 800°C에서 Zr 처리해 잔류 Na2CO3/NaOH를 Na2ZrO3 표면층으로 바꾸고 표층 아래에 Zr을 일부 도핑했습니다. 하드카본 풀셀에서 초기 효율 약 87%, 0.5C 500사이클 후 61.8%를 유지해 미처리 소재(26.4%)보다 크게 개선됐습니다.",
   desc_en:"A Zr treatment at 800°C turns residual Na2CO3/NaOH on O3-type Na[Ni0.3Fe0.3Mn0.4]O2 into a Na2ZrO3-rich surface layer with some near-surface Zr doping. Hard-carbon full cells reach about 87% initial efficiency and keep 61.8% after 500 cycles at 0.5C, versus 26.4% for the bare cathode."},
  {cat:"소재",sub:"SEI 용해",title:"Data-Driven Electrolyte Design by Electrotopological State Descriptors for Na-Ion Batteries with Minimal Solid-Electrolyte Interphase Dissolution",org:"Fei 외",org_en:"Fei et al.",
   journal:"JACS",date:"2026-11-23",ver:true,added:"2026-11-24",link:"https://doi.org/10.1021/jacs.6c12939",
   desc:"나트륨이온 전지에서 SEI가 녹아 나트륨 재고와 전해액을 소모하는 문제를 다양한 전해질에서 정량 평가하고, 200여 개 물성 기술자와의 상관을 데이터 기반으로 분석했습니다. 용매의 평균 전기위상학적 상태(EState) 지수가 SEI 용해와 가장 강하게 상관해 전해질 설계 지표로 제시됐습니다.",
   desc_en:"SEI dissolution, which drains Na inventory and electrolyte in Na-ion full cells, is measured across many electrolytes and correlated with more than 200 physicochemical descriptors in a closed-loop data-driven study. The solvent’s average electrotopological state (EState) index correlates most strongly, offering a design rule for low-dissolution electrolytes."},
  {cat:"소재",sub:"고율 방전",title:"Fast‐Discharge‐Induced Non‐Equilibrium Phase Transition in Ni‐Rich Layered Oxide Cathode at High Voltage",org:"Wang 외",org_en:"Wang et al.",
   journal:"Angewandte Chemie Int. Ed.",date:"2026-11-23",ver:true,added:"2026-11-24",link:"https://doi.org/10.1002/anie.4834219",
   desc:"고시간분해능 오퍼란도 XRD로 하이니켈 양극을 4C 이상으로 빠르게 방전하면 비평형 H3→H2 상전이가 일어나 큰 격자 변위와 나노 변형이 생김을 보였습니다. 이 변형이 Ni 이동 장벽을 낮춰 비가역적 암염상 형성과 구조 붕괴를 촉진한다는 기구를 제시하고 이를 바탕으로 안정화 전략을 설계했습니다.",
   desc_en:"High time-resolution operando XRD shows that fast discharge (≥4C) drives a non-equilibrium H3→H2 transition in Ni-rich cathodes, with large lattice displacement and nanoscale strain. The strain lowers the Ni migration barrier, promoting irreversible rock-salt formation and structural collapse, and the mechanism guides a stabilisation strategy."},
  {cat:"셀",sub:"셀 벤치마킹",title:"Internal Stress Effects on Electrode Stability in Coin Cells with Different Assembly Configurations",org:"Chen 외",org_en:"Chen et al.",
   journal:"ACS Energy Letters",date:"2026-11-23",ver:true,added:"2026-11-24",link:"https://doi.org/10.1021/acsenergylett.6c02869",
   desc:"로봇 자동 조립으로 스프링·스페이서를 양극 캡 쪽(SS-P) 또는 음극 캡 쪽(SS-N)에 두는 두 가지 흔한 코인셀 구성을 비교해, 내부 구조에 따라 전극에 걸리는 응력 분포가 달라지고 전극 안정성에 영향을 준다는 것을 보였습니다. 실험실 간 결과 비교를 위한 조립 표준화의 필요성을 제기합니다.",
   desc_en:"Using fully robotic assembly, the study compares two common coin-cell layouts — spring and spacer on the positive cap side (SS-P) or the negative cap side (SS-N) — and finds they put different stress distributions on the electrodes, affecting stability. It argues for standardised assembly so lab results can be compared."},
  {cat:"셀",sub:"무음극 셀",title:"Prestripping Protocol for Reconciling Lithium Dissolution and Galvanic Corrosion in Anode-Free Batteries",org:"Yu 외",org_en:"Yu et al.",
   journal:"ACS Energy Letters",date:"2026-11-23",ver:true,added:"2026-11-24",link:"https://doi.org/10.1021/acsenergylett.6c02416",
   desc:"무음극 리튬금속 전지에서 저전류 탈리는 피팅을 줄이지만 갈바닉 부식 시간을 늘리고, 고전류 탈리는 그 반대라는 상충을 짧은 저전류 사전 탈리 후 고전류 본 탈리로 조율했습니다. 균일한 초기 용해 전선을 만들면서 Li–Cu 갈바닉 결합 시간을 줄이는 프로토콜입니다.",
   desc_en:"In anode-free Li-metal cells, low-current stripping limits pitting but prolongs galvanic corrosion, while high-current stripping does the reverse. A brief low-current pre-strip followed by higher-current bulk stripping sets a uniform dissolution front while shortening Li–Cu galvanic coupling."},
  {cat:"소재",sub:"나트륨 층상 양극",title:"Bulk Chemical Imbalance Induced by Transition Metal Migration Causes Capacity Decay in Layered Sodium-Ion Battery Cathodes",org:"Tian 외",org_en:"Tian et al.",
   journal:"Nano Energy",date:"2026-11",ver:true,added:"2026-11-24",link:"https://doi.org/10.1016/j.nanoen.2026.112650",

   desc_en:"Identifies a bulk chemical imbalance caused by transition-metal migration as a source of capacity decay in layered Na-ion cathodes."},
  {cat:"소재",sub:"프러시안 블루 양극",title:"Targeted Redox Removal of Structural Water in High-Entropy Prussian Blue Analogue Cathodes for High-Performance Sodium-Ion Batteries",org:"Zhang 외",org_en:"Zhang et al.",
   journal:"Energy Storage Materials",date:"2026-11",ver:true,added:"2026-11-24",link:"https://doi.org/10.1016/j.ensm.2026.105682",

        {"title":"국내 판매 한국산 EV의 중국산 셀 비중 40.4% (8월)","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"8월 국내에서 판매된 한국산 EV의 40.4%가 중국산 셀을 탑재했고, 기아 모델에 CATL 셀이 다수 들어간 것으로 집계됐습니다. 위의 탈중국 규제 흐름과 정면으로 엇갈리는 수치입니다.","desc_en":"40.4% of Korean-built EVs sold domestically in August shipped with Chinese cells, with CATL cells in many Kia models. The figure runs directly against the de-risking regulation above.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"현대차그룹 — 200 kWh 사용후 배터리 저장장치를 급속충전 인프라와 통합","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"200 kWh 규모 사용후 배터리 저장장치를 급속충전 인프라와 묶는 파일럿을 시작했습니다. 그리드 기여와 2차 사용 사업성을 함께 검증하려는 구성입니다.","desc_en":"A pilot tying a 200 kWh second-life storage unit into fast-charging infrastructure, set up to test grid contribution and the commercial case for second-life use at the same time.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"}
      ]},
      {key:"해외", ko:"해외 (Global)", en:"Global", items:[
        {"title":"CATL — 헝가리 데브레첸 공장 시험 생산 개시, 물류·해외 확장 다발","meta":"2026-09-27 / 2026-09-20 · 업계 다이제스트 #39·#38","meta_en":"27 Sep / 20 Sep 2026 · industry digests #39 and #38","desc":"목표 100 GWh의 헝가리 데브레첸 공장에서 2개 라인 시험(cell trial) 생산을 시작했고, Kuehne+Nagel과 유럽·중국 배터리 물류 및 전동화 파트너십 MOU를 맺었습니다. 앞서 9월 20일 자로는 이집트 BME와 현지 팩 조립(초기 1 GWh) 협력, DHL과 유럽 그린 화물회랑 MoU가 확인됐습니다.","desc_en":"Trial cell production started on two lines at the Debrecen plant in Hungary, which targets 100 GWh, and an MOU with Kuehne+Nagel covers battery logistics and electrification across Europe and China. From 20 September: local pack assembly with BME in Egypt starting at 1 GWh, and a green freight corridor MoU with DHL in Europe.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"CATL — 587 Ah LFP ESS 셀 435위안/kWh, 상용차 모듈 플랫폼 TECTRANS II","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"587 Ah급 LFP ESS 셀을 kWh당 435위안에 5년 보증 조건으로 공급하겠다고 밝히고, 상용차용 모듈 플랫폼 TECTRANS II를 공개했습니다. ESS 셀 대형화와 가격 공세가 같이 움직이고 있음을 보여주는 발표입니다.","desc_en":"A 587 Ah LFP storage cell offered at 435 yuan per kWh with a five-year warranty, plus the TECTRANS II module platform for commercial vehicles. Larger storage cells and price pressure are arriving together.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"BYD — 고속도로 플래시 충전소 2,000곳 조기 완공, 국내망 11,586곳","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"고속도로 플래시 충전소 2,000곳을 계획보다 3개월 앞당겨 완공했고, 국내 충전망을 341개 도시 11,586곳까지 확대했습니다. 연말 20,000곳이 목표입니다.","desc_en":"Two thousand highway flash-charging stations finished three months ahead of plan, with the domestic network now at 11,586 sites across 341 cities and a year-end target of 20,000.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"BYD — 내년 차량 탑재 전고체 배터리 실증 (양산 아닌 개념 검증)","meta":"2026-09-20 · 개별 보도 확인","meta_en":"20 Sep 2026 · individually sourced report","desc":"내년에 차량에 얹어 전고체 배터리를 실증하는 것이 목표이며, 양산이 아니라 개념 검증 단계라는 점을 명확히 했습니다. 아래 Li Auto의 전망과 나란히 두면 업계 내부의 시점 인식 차이가 드러납니다.","desc_en":"The goal is an in-vehicle solid-state demonstration next year, explicitly framed as concept validation rather than volume production. Set beside Li Auto's outlook below, it shows how far apart the industry's own timelines sit.","link":"https://carnewschina.com/2026/08/10/catl-joins-byd-in-targeting-2027-solid-state-battery-trial-production/"},
        {"title":"Panasonic Energy — 오사카에 글로벌 배터리 R&D 허브 ‘Energy Innovation Square’ 개소","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"오사카에 글로벌 배터리 R&D 허브를 열었습니다. 셀 개발 역량을 한곳으로 모으는 조직 차원의 움직임입니다.","desc_en":"A global battery R&D hub opened in Osaka — an organisational move that concentrates cell development capability in one place.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"Factorial × Mitsui Kinzoku — 황화물 전해질 기반 전고체 플랫폼 산업화","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"황화물(sulfide) 전해질 역량과 제조 개발을 결합해 전고체 플랫폼을 산업화하는 협력입니다. 소재 기업과 셀 기업이 공정 개발 단계에서 묶이는 형태입니다.","desc_en":"A collaboration pairing sulfide electrolyte capability with manufacturing development to industrialise a solid-state platform — a materials company and a cell company tied together at the process-development stage.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"Mercedes-Benz × ProLogium — Gen4 리튬 세라믹 셀 우선 평가 접근권","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"ProLogium의 Gen4 리튬 세라믹 셀에 대해 전기·열·안전 항목의 우선 평가 접근권을 확보했습니다. 완성차가 차세대 셀을 양산 전에 선점 평가하는 통로입니다.","desc_en":"Priority access to evaluate ProLogium's Gen4 lithium-ceramic cells on electrical, thermal and safety criteria — the route by which a carmaker gets first assessment of a next-generation cell before it reaches production.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"Li Auto — 전고체 2027~2028년 제한 적용, 전면 양산은 5년 더 필요","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"전고체 배터리는 2027~2028년에 제한적으로 적용되고, 전면 양산까지는 수명과 비용 과제를 해결하는 데 5년이 더 필요하다는 전망을 내놨습니다. 위 BYD 실증 일정과 함께 읽어야 하는 온도차입니다.","desc_en":"Solid-state batteries seen in limited use in 2027-2028, with full volume production needing five more years to resolve lifetime and cost. The gap against BYD's demonstration schedule above is the point.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"Geely — 2,250 kW 스마트 충전소, 12C·6C 배터리 공개","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"2,250 kW급 스마트 충전소와 12C·6C 배터리 기술을 공개하고, 2027년 말까지 10만 개 이상의 충전 포트를 목표로 제시했습니다.","desc_en":"A 2,250 kW smart charging station and 12C/6C battery technology unveiled, with a target of more than 100,000 charging ports by the end of 2027.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"Sunwoda EVB — 상온 10%→97% 9분 충전 15C 배터리 시스템","meta":"2026-09-27 · 업계 다이제스트 #39","meta_en":"27 Sep 2026 · industry digest #39","desc":"상온에서 10%에서 97%까지 9분에 충전하는 15C 배터리 시스템을 공개하고, 2027년 말까지 만 개 규모의 초급속 충전소 계획을 밝혔습니다. 셀 성능과 충전 인프라를 함께 내놓는 방식이 이번 주 중국 업체들의 공통 패턴입니다.","desc_en":"A 15C battery system charging from 10% to 97% in nine minutes at room temperature, with plans for ten thousand ultra-fast charging stations by the end of 2027. Announcing cell performance and charging infrastructure together was the shared pattern among Chinese players this week.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"},
        {"title":"HiTHIUM — 20,000 사이클 나트륨이온 ESS ‘∞Power N4.0MWh’ 출시","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"20,000 사이클 수명을 내세운 나트륨이온 ESS 제품을 출시하고 2027년 유틸리티급 배치를 계획하고 있습니다. 나트륨이온이 전기차가 아니라 ESS 쪽에서 먼저 제품화되는 흐름을 보여줍니다.","desc_en":"A sodium-ion storage product claiming 20,000 cycles, with utility-scale deployment planned for 2027 — sodium-ion reaching product form in storage rather than in vehicles.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"Gotion High-Tech — 사우디 3개 사이트 6 GWh ESS 수주","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"사우디아라비아 3개 사이트에 6 GWh 규모 ESS를 수주했습니다. 사막 환경과 태양광 연계를 전제로 설계된 프로젝트입니다.","desc_en":"Orders for 6 GWh of storage across three sites in Saudi Arabia, designed for desert conditions and paired with solar.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"}
      ]},
      {key:"정책", ko:"정책·자원·리사이클링 (Policy / Materials / Recycling)", en:"Policy / Materials / Recycling", items:[
        {"title":"EU — “Made in EU” 규정 도입, 중국산 하이브리드 수입 제한·관세 검토","meta":"2026-09-20 · 업계 다이제스트 #38 (Transport & Environment 의견 포함)","meta_en":"20 Sep 2026 · industry digest #38 (including Transport & Environment)","desc":"“Made in EU” 규정을 도입하고, 중국산 하이브리드 수입에 대한 자발적 물량 제한과 관세 인상을 검토하고 있습니다. 동시에 Transport & Environment는 핵심원자재(CRM) 투자 강화를 요구했습니다.","desc_en":"“Made in EU” rules introduced, with voluntary volume limits and higher tariffs on Chinese hybrid imports under consideration. Transport & Environment separately called for stronger investment in critical raw materials.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"미국 DOE — Elevated Materials 5,000만 달러 지원, TDK Ventures의 R3 Lithium 투자","meta":"2026-09-20~27 · 업계 다이제스트 #38","meta_en":"20-27 Sep 2026 · industry digest #38","desc":"DOE가 초박막 리튬메탈 필름 생산에 5,000만 달러를 지원했고, TDK Ventures는 미국 내 탄산리튬 생산을 앞당기기 위해 R3 Lithium에 투자했습니다. 음극 소재와 리튬 정제 양쪽에 자금이 들어가고 있습니다.","desc_en":"The DOE put $50m behind ultra-thin lithium-metal film production, while TDK Ventures invested in R3 Lithium to accelerate domestic lithium carbonate output. Money is going into both the anode material and lithium refining.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"E3 Lithium × Epsilon CAM — 앨버타산 배터리급 탄산리튬 최대 5,000톤 5년 공급 MOU","meta":"2026-09-20 · 업계 다이제스트 #38","meta_en":"20 Sep 2026 · industry digest #38","desc":"앨버타에서 생산한 배터리급 탄산리튬을 최대 5,000톤 규모로 5년간 공급하는 MOU입니다. 북미 역내 리튬 조달을 CAM 단계와 직접 연결하는 계약입니다.","desc_en":"An MOU to supply up to 5,000 tonnes of battery-grade lithium carbonate from Alberta over five years, linking North American lithium sourcing directly to the CAM stage.","link":"https://battery-tech.net/batterytech-news-updates-2026-38/"},
        {"title":"리사이클링 — Altilium 환경인가, Bridge Green 8년 공급계약, Samsar 1,000번째 재제조","meta":"2026-09-27 · 업계 다이제스트 #39 (Porsche 100% 재활용 셀은 공정 항목 참조)","meta_en":"27 Sep 2026 · industry digest #39 (Porsche's fully recycled cells are under Process)","desc":"Altilium이 영국 플리머스에서 흑질(black mass) 습식 회수 환경인가를 받았고, Bridge Green × Hartree Partners는 연 약 1만 톤 규모 재활용 탄산리튬 8년 공급계약을 체결했으며, Samsar Resources는 닛산 리프 배터리팩 1,000번째 재제조를 달성했습니다.","desc_en":"Altilium received environmental permitting for hydrometallurgical black-mass recovery in Plymouth, UK; Bridge Green and Hartree Partners signed an eight-year contract for roughly 10,000 tonnes a year of recycled lithium carbonate; and Samsar Resources completed its thousandth remanufactured Nissan Leaf pack.","link":"https://battery-tech.net/batterytech-news-updates-2026-39/"}
      ]}

  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=newFirst(items).map(r=>{
    const c=REGCLR[r.region];
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card${isNew(r)?' is-new':''}">
      <div class="badges">${newBadge(r)}${badge(regLbl(r.region),c,tint(c))}${badge(typeLbl(r.type),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${compLbl(r.company)}</h4><p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkI}</a></div></div>`;
  }).join('');
}
function renderScience(){
  const box=document.getElementById('scienceCards'); const q=sQ.toLowerCase();
  const items=science.filter(r=>(sField==="전체"||r.field===sField)&&(!q||(r.title+(r.title_en||"")+r.desc+(r.desc_en||"")+(r.source||"")).toLowerCase().includes(q)));
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=newFirst(items).map(r=>{
    const c=FIELDCLR[r.field]||'var(--ink-2)';
    const title=lang==="en"&&r.title_en?r.title_en:r.title;
    const desc=lang==="en"?r.desc_en:r.desc;
    return `<div class="card${isNew(r)?' is-new':''}">
      <div class="badges">${newBadge(r)}${badge(fieldLbl(r.field),c,tint(c))}${badge(r.source,'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${title}</h4>
      <p>${desc}</p>
      <div class="foot"><span class="date">${r.date} · ${verBadge(r.ver)}</span>
      <a class="link" href="${r.link}" target="_blank" rel="noopener">${T().linkS}</a></div></div>`;
  }).join('');
}
function renderBriefing(){
  const box=document.getElementById('briefingBody');
  const L=(o)=>o?(lang==="en"?(o.en||o.ko):o.ko):"";
  const b=briefings[bSel]||briefings[0];
  document.getElementById('briefEditions').innerHTML=
    `<span class="chipLbl">${T().briefEditions}</span>`+briefings.map((e,i)=>
      `<button class="chip${i===bSel?' active':''}" data-be="${i}">${e.date}</button>`).join('');
  document.getElementById('calloutB').innerHTML=
    `<b>${T().briefTitle(b.date)}</b> · ${L(b.window)}<br>${L(b.note)}`;
  const src=(b.sources||[]).map(s=>`<a class="link" href="${s.url}" target="_blank" rel="noopener">${lang==="en"?(s.en||s.ko):s.ko}</a>`).join(' · ');
  document.getElementById('summaryB').innerHTML=`<b>${T().briefSummary}</b><br>${L(b.summary)}`
    +(src?`<div class="bsrc"><b>${T().briefSources}</b><br>${src}</div>`:'');
  box.innerHTML=b.sections.map(s=>{
    const c=CATCLR[s.key]||REGCLR[s.key]||'var(--ink-2)';
    const cards=s.items.map(x=>`<div class="card">
      <div class="badges">${badge(lang==="en"?s.en:s.ko,c,tint(c))}${badge(lang==="en"?x.meta_en:x.meta,'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${x.title}</h4>
      <p>${lang==="en"?x.desc_en:x.desc}</p>
      <div class="foot"><span class="date"></span>
      ${x.link?`<a class="link" href="${x.link}" target="_blank" rel="noopener">${T().linkB}</a>`:''}</div></div>`).join('');
    return `<h3 class="briefH">${lang==="en"?s.en:s.ko}</h3><div class="cards">${cards}</div>`;
  }).join('');
}
function renderArchive(){
  const box=document.getElementById('archiveList');
  const items=archive.filter(x=>aJ==="전체"||x.journal===aJ);
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  const byMonth={};
  items.forEach(x=>{const m=x.date.slice(0,7);(byMonth[m]=byMonth[m]||[]).push(x);});
  box.innerHTML=Object.keys(byMonth).sort().reverse().map(m=>{
    const rows=byMonth[m].slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(x=>{
      const c=CATCLR[x.cat]||'var(--ink-2)';
      const org=lang==="en"&&x.org_en?x.org_en:x.org;
      const desc=lang==="en"?x.desc_en:x.desc;
      /* Joule deposits month-only dates to Crossref; the month header already carries that,
         so show a dash rather than a two-digit month masquerading as a day. */
      const day=x.date.length>7?x.date.slice(5):"—";
      return `<div class="arch-row">
        <div class="d">${day}</div>
        <div class="j" style="color:${c}">${x.journal}</div>
        <div class="t">
          ${x.nv?'<span class="arch-star" title="News &amp; Views">★</span>':''}
          <a href="${x.link}" target="_blank" rel="noopener">${x.title}</a>
          <span class="who"> · ${org}</span>
          <span class="sum">${desc}</span>
        </div></div>`;
    }).join('');
    return `<div class="arch-month"><h3>${m}</h3><span class="n">${byMonth[m].length}</span></div>${rows}`;
  }).join('');
}
function renderFilters(){
  const rCats=["전체","소재","전극","셀","공정","저널"];
  document.getElementById('researchFilters').innerHTML=
    rCats.map(c=>`<button class="chip${c===rCat?' active':''}" data-rc="${c}">${catLbl(c)} <span style="opacity:.7">${c==="전체"?research.length:research.filter(x=>x.cat===c).length}</span></button>`).join('')
    +`<input class="search" id="rSearch" placeholder="${T().searchR}" value="${rQ.replace(/"/g,'&quot;')}">`;
  const iRegs=["전체","국내","해외"];
  document.getElementById('industryFilters').innerHTML=
    iRegs.map(c=>`<button class="chip${c===iReg?' active':''}" data-ir="${c}">${regLbl(c)} <span style="opacity:.7">${c==="전체"?industry.length:industry.filter(x=>x.region===c).length}</span></button>`).join('')
    +`<input class="search" id="iSearch" placeholder="${T().searchI}" value="${iQ.replace(/"/g,'&quot;')}">`;
  document.getElementById('rSearch').addEventListener('input',e=>{rQ=e.target.value;renderResearch();});
  document.getElementById('iSearch').addEventListener('input',e=>{iQ=e.target.value;renderIndustry();});
  const sFields=["전체","물리","우주","생명","지구","기술"];
  document.getElementById('scienceFilters').innerHTML=
    sFields.map(c=>`<button class="chip${c===sField?' active':''}" data-sf="${c}">${fieldLbl(c)} <span style="opacity:.7">${c==="전체"?science.length:science.filter(x=>x.field===c).length}</span></button>`).join('')
    +`<input class="search" id="sSearch" placeholder="${T().searchS}" value="${sQ.replace(/"/g,'&quot;')}">`;
  document.getElementById('sSearch').addEventListener('input',e=>{sQ=e.target.value;renderScience();});
  const aCount={};archive.forEach(x=>{aCount[x.journal]=(aCount[x.journal]||0)+1;});
  const aJournals=["전체"].concat(Object.keys(aCount).sort((a,b)=>aCount[b]-aCount[a]||a.localeCompare(b)));
  document.getElementById('archiveFilters').innerHTML=
    aJournals.map(j=>`<button class="chip${j===aJ?' active':''}" data-aj="${j}">${j==="전체"?catLbl("전체"):j} <span style="opacity:.7">${j==="전체"?archive.length:aCount[j]}</span></button>`).join('');
}
function hbar(container,rows,unit){
  const max=Math.max(...rows.map(r=>Math.abs(r.v)));
  document.getElementById(container).innerHTML=rows.map(r=>{
    const w=Math.max(2,Math.abs(r.v)/max*100);
    return `<div class="bar-row"><div class="name">${r.n}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${r.c||'var(--s1)'}"></div></div>
      <div class="num">${r.v.toLocaleString()}${unit||''}</div></div>`;}).join('');
}
function renderCharts(){
  const t=T();
  hbar('chartCat',["소재","전극","셀","공정","저널"].map(c=>({n:catLbl(c),v:research.filter(x=>x.cat===c).length,c:CATCLR[c]})),t.unitCount);
  hbar('chartEarnings',[
    {n:compLbl("LG에너지솔루션"),v:7560},{n:compLbl("삼성SDI"),v:4078},{n:compLbl("SK온"),v:-805}].map(r=>({...r,c:"var(--s1)"})),t.unitEok);
  const nt={};industry.forEach(i=>{nt[i.type]=(nt[i.type]||0)+1;});
  hbar('chartNews',Object.entries(nt).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n:typeLbl(n),v,c:"var(--s3)"})),t.unitCount);
  document.getElementById('themeList').innerHTML=t.themes
    .map(([k,v])=>`<div><span style="color:var(--amber);font-weight:800">▸</span> <b style="color:var(--ink)">${k}</b> — ${v}</div>`).join('');
}
/* ---- Student sections: 채용 / 포닥 / 과제 ----------------------------------
   These three panels render from data/*.json rather than from inline arrays, so a
   weekly pipeline only has to rewrite the JSON. They share one card template; the
   per-file differences live in the data, not here. */
function studentNotice(id,d){
  const box=document.getElementById(id);
  const stale=d.stale?` <span style="color:var(--serious)">${T().seedStale}</span>`:'';
  box.innerHTML=`<b>${pick(d.notice)}</b> <span style="color:var(--muted)">· ${T().lastChecked(d.updated)}</span>${stale}<br>${pick(d.context)}`;
}
function studentPortals(id,d){
  const box=document.getElementById(id);
  if(!d||!d.portals){box.innerHTML="";return;}
  const links=d.portals.map(p=>
    `<a href="${p.url}" target="_blank" rel="noopener" style="color:var(--brand-ink);text-decoration:none;font-weight:600">${lang==="en"?(p.name_en||p.name):p.name} ↗</a>`
  ).join(' <span style="color:var(--muted)">·</span> ');
  box.innerHTML=`<b>${pick(d.portals_title)}</b><br>${links}`;
}
const grpLbl=(d,k)=>{if(lang!=="en")return k;const it=d.items.find(x=>x.group===k);return it&&it.group_en?it.group_en:k;};
function studentFilters(id,d,attr,cur){
  const box=document.getElementById(id);
  if(!d||!d.items){box.innerHTML="";return;}
  const keys=["전체"].concat([...new Set(d.items.map(x=>x.group))]);
  box.innerHTML=keys.map(k=>{
    const label=k==="전체"?(lang==="en"?"All":"전체"):grpLbl(d,k);
    return `<button class="chip${k===cur?' active':''}" data-${attr}="${k}">${label}</button>`;
  }).join('');
}
function studentCards(id,d,cur){
  const box=document.getElementById(id);
  const items=(d.items||[]).filter(x=>cur==="전체"||x.group===cur);
  if(!items.length){box.innerHTML=`<div class="empty">${T().empty}</div>`;return;}
  box.innerHTML=items.map(x=>{
    const c=GRPCLR[x.group]||'var(--ink-2)';
    const st=x.ok?`<span class="verified">${T().stOk}</span>`:`<span class="unverified">${T().stCheck}</span>`;
    /* What the link promises has to match where it goes. link_type="deep" means the
       URL opens the posting itself; "search" and "portal" mean it does not, so the
       label names the search term instead of implying a posting is one click away.
       Some entries genuinely have no URL at all (an expired listing with no
       replacement) — render the card without a link rather than inventing one. */
    const deep=x.link_type==="deep";
    const q=sLbl(x,'query')||sLbl(x,'title');
    const label=deep?T().linkDeep:T().linkSearch(q);
    const link=x.link?`<a class="link${deep?'':' soft'}" href="${x.link}" target="_blank" rel="noopener">${label}</a>`:'';
    return `<div class="card">
      <div class="badges">${badge(sLbl(x,'group'),c,tint(c))}${badge(sLbl(x,'tag'),'var(--ink-2)','var(--surface-2)')}</div>
      <h4>${sLbl(x,'title')}</h4>
      <div class="meta"><b>${sLbl(x,'meta')}</b></div>
      <p>${sLbl(x,'desc')}</p>
      <div class="foot"><span class="date">${sLbl(x,'deadline')} · ${st}</span>${link}</div></div>`;
  }).join('');
}
function renderJobs(){const d=STUDENT.jobs;studentNotice('noticeJ',d);studentFilters('jobsFilters',d,'jf',jF);studentCards('jobsCards',d,jF);studentPortals('portalsJ',d);}
function renderPostdoc(){const d=STUDENT.postdoc;studentNotice('noticeP',d);studentFilters('postdocFilters',d,'pf',pF);studentCards('postdocCards',d,pF);studentPortals('portalsP',d);}
function renderGrants(){const d=STUDENT.grants;studentNotice('noticeG',d);studentFilters('grantsFilters',d,'gf',gF);studentCards('grantsCards',d,gF);studentPortals('portalsG',d);}
function loadStudentData(){
  const files={jobs:"data/jobs.json",postdoc:"data/postdoc.json",grants:"data/grants.json"};
  const redraw={jobs:renderJobs,postdoc:renderPostdoc,grants:renderGrants};
  Object.keys(files).forEach(k=>{
    fetch(files[k],{cache:"no-cache"})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(j=>{if(j&&Array.isArray(j.items)&&j.items.length)STUDENT[k]=j;})
      .catch(()=>{STUDENT[k].stale=true;})
      .then(()=>redraw[k]());
  });
}
function renderAll(){applyStatic();renderFilters();renderResearch();renderIndustry();renderScience();renderBriefing();renderArchive();renderCharts();renderJobs();renderPostdoc();renderGrants();}

/* ================= EVENTS ================= */
document.getElementById('researchFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-rc]');if(!b)return;
  rCat=b.dataset.rc;
  document.querySelectorAll('[data-rc]').forEach(x=>x.classList.toggle('active',x.dataset.rc===rCat));
  renderResearch();
});
document.getElementById('industryFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-ir]');if(!b)return;
  iReg=b.dataset.ir;
  document.querySelectorAll('[data-ir]').forEach(x=>x.classList.toggle('active',x.dataset.ir===iReg));
  renderIndustry();
});
document.getElementById('scienceFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-sf]');if(!b)return;
  sField=b.dataset.sf;
  document.querySelectorAll('[data-sf]').forEach(x=>x.classList.toggle('active',x.dataset.sf===sField));
  renderScience();
});
document.getElementById('briefEditions').addEventListener('click',e=>{
  const b=e.target.closest('[data-be]');if(!b)return;
  bSel=Number(b.dataset.be);
  renderBriefing();
});
document.getElementById('archiveFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-aj]');if(!b)return;
  aJ=b.dataset.aj;
  document.querySelectorAll('[data-aj]').forEach(x=>x.classList.toggle('active',x.dataset.aj===aJ));
  renderArchive();
});
document.getElementById('jobsFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-jf]');if(!b)return;
  jF=b.dataset.jf;renderJobs();
});
document.getElementById('postdocFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-pf]');if(!b)return;
  pF=b.dataset.pf;renderPostdoc();
});
document.getElementById('grantsFilters').addEventListener('click',e=>{
  const b=e.target.closest('[data-gf]');if(!b)return;
  gF=b.dataset.gf;renderGrants();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');document.getElementById('panel-'+t.dataset.tab).classList.add('active');}));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  updateThemeBtn();
});
document.getElementById('langSeg').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===lang)return;
  lang=b.dataset.lang;renderAll();
});

/* ================= INIT (dark + Korean by default) ================= */
renderAll();
loadStudentData();
</script>
